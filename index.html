<style>
:root {
  --bg: #0d0e10;
  --panel: #15171a;
  --panel-2: #1b1e22;
  --hover: #22262b;
  --line: #2a2e34;
  --line-strong: #3a3f47;
  --text: #ecedef;
  --muted: #a0a5ad;
  --faint: #6c727b;
  --accent: #ff7a3d;
  --accent-ink: #1a0d06;
  --accent-soft: rgba(255, 122, 61, .13);
  --ok: #3ccf8e;
  --ok-soft: rgba(60, 207, 142, .12);
  --warn: #f2b84b;
  --warn-soft: rgba(242, 184, 75, .12);
  --model: #d9dce1;
  --grid: #8a9099;
  --shadow: 0 24px 60px rgba(0, 0, 0, .5);
  --radius: 12px;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f3f3f1;
    --panel: #ffffff;
    --panel-2: #f7f7f5;
    --hover: #efefec;
    --line: #e4e4e0;
    --line-strong: #d0d0cb;
    --text: #18191b;
    --muted: #5d6168;
    --faint: #8d9198;
    --accent: #e8622a;
    --accent-ink: #ffffff;
    --accent-soft: rgba(232, 98, 42, .1);
    --ok: #1f9d68;
    --ok-soft: rgba(31, 157, 104, .1);
    --warn: #b7791f;
    --warn-soft: rgba(183, 121, 31, .1);
    --model: #c9ccd2;
    --grid: #9aa0a8;
    --shadow: 0 24px 60px rgba(20, 20, 30, .18);
    color-scheme: light;
  }
}
:root[data-theme="dark"] { color-scheme: dark; }

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
svg { display: block; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

/* ---------- Header ---------- */
.top {
  position: sticky; top: 0; z-index: 20;
  background: color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter: saturate(1.4) blur(12px);
  -webkit-backdrop-filter: saturate(1.4) blur(12px);
  border-bottom: 1px solid var(--line);
}
.top-inner {
  max-width: 1320px; margin: 0 auto; padding: 0 24px;
  display: flex; align-items: center; gap: 24px; height: 60px;
}
.brand { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
.brand-mark {
  width: 28px; height: 28px; border-radius: 8px; background: var(--accent);
  display: grid; place-items: center; color: var(--accent-ink);
}
.brand-name { font-weight: 700; letter-spacing: .04em; }
.brand-sub { color: var(--faint); font-size: 13px; }
.tabs { display: flex; gap: 2px; height: 100%; }
.tab {
  background: none; border: 0; padding: 0 14px; height: 100%;
  color: var(--muted); font-weight: 550; position: relative;
}
.tab:hover { color: var(--text); }
.tab[aria-selected="true"] { color: var(--text); }
.tab[aria-selected="true"]::after {
  content: ""; position: absolute; left: 12px; right: 12px; bottom: -1px; height: 2px;
  background: var(--accent); border-radius: 2px;
}
.top-actions { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.pill {
  display: inline-flex; align-items: center; gap: 7px;
  font-size: 12px; color: var(--muted); padding: 5px 10px;
  border: 1px solid var(--line); border-radius: 999px; white-space: nowrap; background: none;
}
.pill i { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
.pill.live i { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); }
.pill.static i { background: var(--warn); }
.btn {
  display: inline-flex; align-items: center; gap: 7px;
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
  padding: 7px 12px; font-size: 13px; font-weight: 550; text-decoration: none; white-space: nowrap;
  transition: border-color .15s, background .15s;
}
.btn:hover { border-color: var(--line-strong); background: var(--hover); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn svg { width: 15px; height: 15px; }

main { max-width: 1320px; margin: 0 auto; padding: 24px; }
.view[hidden] { display: none !important; }

/* ---------- Builder ---------- */
.bcol { position: sticky; top: 84px; display: flex; flex-direction: column; gap: 14px; max-height: calc(100vh - 108px); overflow: auto; }
.bcol .config { position: static; max-height: none; overflow: visible; }
.bp { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; flex: none; }
.bp-stage { position: relative; height: 250px; background: radial-gradient(ellipse at 50% 25%, #eceded, #bfc2c7); }
.bp-stage canvas { position: absolute; inset: 0; width: 100% !important; height: 100% !important; }
.builder { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 24px; align-items: start; }
.config {
  position: sticky; top: 84px;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 20px; display: flex; flex-direction: column; gap: 18px;
  max-height: calc(100vh - 108px); overflow: auto;
}
.field > .lbl {
  display: flex; justify-content: space-between; align-items: baseline;
  font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 8px;
  text-transform: uppercase; letter-spacing: .06em;
}
.field > .lbl small { text-transform: none; letter-spacing: 0; font-weight: 450; color: var(--faint); }
.seg {
  display: flex; background: var(--panel-2); border: 1px solid var(--line);
  border-radius: 9px; padding: 3px; gap: 3px;
}
.seg button {
  flex: 1; border: 0; background: none; border-radius: 6px; padding: 7px 4px;
  font-weight: 600; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 1px;
  transition: background .15s, color .15s;
}
.seg button small { font-size: 10.5px; font-weight: 500; color: var(--faint); }
.seg button:hover:not(:disabled) { color: var(--text); }
.seg button[aria-pressed="true"] { background: var(--hover); color: var(--text); box-shadow: inset 0 0 0 1px var(--line-strong); }
.seg button[aria-pressed="true"] small { color: var(--muted); }
.seg button:disabled { opacity: .3; cursor: not-allowed; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  border: 1px solid var(--line); background: none; border-radius: 999px;
  padding: 5px 11px; font-size: 13px; color: var(--muted);
}
.chip:hover { color: var(--text); border-color: var(--line-strong); }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 55%, transparent); color: var(--text); }
.row-inline { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.row-inline .lbl { margin: 0; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); }
.stepper button { border: 0; background: none; width: 32px; height: 30px; font-size: 16px; color: var(--muted); }
.stepper button:hover { color: var(--text); }
.stepper output { min-width: 28px; text-align: center; font-weight: 650; font-variant-numeric: tabular-nums; }
.switch { position: relative; width: 36px; height: 20px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--line-strong); transition: background .15s; pointer-events: none; }
.switch span::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { transform: translateX(16px); }
.switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.divider { height: 1px; background: var(--line); margin: 2px 0; }
.ref {
  display: block; width: 100%; border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
  background: #9aa0a8; padding: 0; position: relative;
}
.ref img { width: 100%; display: block; aspect-ratio: 2.4; object-fit: cover; }
.ref span {
  position: absolute; left: 8px; bottom: 8px; font-size: 11.5px; font-weight: 600;
  background: rgba(0, 0, 0, .62); color: #fff; padding: 3px 8px; border-radius: 6px;
}

.results { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.summary {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 20px 22px; display: grid; grid-template-columns: 1fr auto; gap: 16px 24px; align-items: center;
}
.summary h1 { margin: 0; font-size: 26px; letter-spacing: -.01em; line-height: 1.15; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.summary h1 em { font-style: normal; color: var(--accent); }
.summary h1 small { font-size: 15px; font-weight: 500; color: var(--muted); }
.summary .facts { color: var(--muted); font-size: 13px; margin-top: 4px; }
.summary .acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.specs { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.spec { background: var(--panel-2); box-shadow: 0 0 0 .5px var(--line); padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.spec span { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); }
.spec b { font-size: 15px; font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; }
.spec b i { font-style: normal; font-weight: 500; font-size: 12px; color: var(--muted); }
.spec small { font-size: 11.5px; color: var(--faint); }
.progress { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; font-size: 12.5px; color: var(--muted); }
.bar { flex: 1; height: 6px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--ok); border-radius: 999px; transition: width .3s ease; }
.progress b { color: var(--text); font-variant-numeric: tabular-nums; }

.section { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.section-hd { display: flex; align-items: baseline; gap: 10px; padding: 13px 18px 11px; border-bottom: 1px solid var(--line); }
.section-hd h2 { margin: 0; font-size: 13px; font-weight: 650; letter-spacing: .02em; }
.section-hd span { font-size: 12px; color: var(--faint); }
.list { list-style: none; margin: 0; padding: 0; }

.row {
  display: grid; grid-template-columns: 26px 44px minmax(0, 1fr) auto 48px 64px auto;
  align-items: center; gap: 12px; padding: 9px 12px 9px 18px; border-top: 1px solid var(--line);
  transition: background .12s;
}
.list > .row:first-child { border-top: 0; }
.row:hover { background: var(--panel-2); }
.ck { position: relative; width: 18px; height: 18px; }
.ck input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.ck span {
  position: absolute; inset: 0; border: 1.5px solid var(--line-strong); border-radius: 5px; pointer-events: none;
  display: grid; place-items: center; transition: background .12s, border-color .12s;
}
.ck input:checked + span { background: var(--ok); border-color: var(--ok); }
.ck input:checked + span::after { content: ""; width: 9px; height: 5px; border: 2px solid #fff; border-top: 0; border-right: 0; transform: translateY(-1px) rotate(-45deg); }
.ck input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.meta { min-width: 0; display: flex; flex-direction: column; gap: 1px; background: none; border: 0; padding: 0; text-align: left; }
.meta .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meta .pt { font-family: var(--mono); font-size: 11px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
button.meta:hover .nm { color: var(--accent); }
.row.done .nm { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--faint); }
.badges { display: flex; gap: 5px; justify-content: flex-end; flex-wrap: wrap; }
.badge { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 999px; white-space: nowrap; border: 1px solid transparent; }
.badge.sup { background: var(--warn-soft); color: var(--warn); }
.badge.pcs { background: var(--accent-soft); color: var(--accent); }
.badge.muted { border-color: var(--line); color: var(--faint); }
.badge.mat { display: inline-flex; align-items: center; gap: 5px; }
.badge.mat.matte { background: var(--text); color: var(--bg); }
.badge.mat.basic { border-color: var(--line-strong); color: var(--muted); }
.badge.mat.tpu { border: 1px dashed var(--line-strong); color: var(--muted); }
.badge.mat.mat-sm { display: none; align-self: flex-start; margin-top: 3px; }
.facts .badge { margin-left: 6px; }
.qty { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
.qty.na { color: var(--faint); font-weight: 500; font-size: 12px; }
.sz { font-size: 12px; color: var(--faint); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.acts-row { display: flex; gap: 2px; min-width: 66px; justify-content: flex-end; }
.ib {
  width: 32px; height: 32px; display: grid; place-items: center; border-radius: 8px;
  border: 0; background: none; color: var(--muted); text-decoration: none;
}
.ib:hover { background: var(--hover); color: var(--text); }
.ib svg { width: 17px; height: 17px; }
.row.missing .nm { color: var(--warn); }
.thumb {
  width: 44px; height: 44px; border-radius: 8px; overflow: hidden; flex: none;
  background: var(--panel-2); border: 1px solid var(--line); display: grid; place-items: center; color: var(--faint);
  padding: 0;
}
.thumb img { width: 100%; height: 100%; object-fit: contain; }
.thumb svg { width: 18px; height: 18px; }
button.thumb:hover { border-color: var(--line-strong); }
.opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 8px; }
.opt {
  border: 1px solid var(--line); background: var(--panel-2); border-radius: 10px; padding: 6px 6px 8px;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  font-size: 12px; font-weight: 600; color: var(--muted); line-height: 1.25; text-align: center;
  transition: border-color .15s, background .15s;
}
.opt:hover { border-color: var(--line-strong); color: var(--text); }
.opt .pic { width: 100%; aspect-ratio: 4 / 3; display: grid; place-items: center; }
.opt .pic img { width: 100%; height: 100%; object-fit: contain; }
.opt .pic .none { width: 42%; aspect-ratio: 1; border: 1.5px dashed var(--line-strong); border-radius: 8px; }
.opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--text); }
.note { font-size: 12.5px; color: var(--faint); padding: 2px 4px; line-height: 1.55; }

/* ---------- Browse ---------- */
.browse-bar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 18px; }
.search {
  flex: 1 1 320px; display: flex; align-items: center; gap: 10px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 0 12px; height: 42px;
}
.search:focus-within { border-color: var(--line-strong); box-shadow: 0 0 0 3px var(--accent-soft); }
.search svg { width: 17px; height: 17px; color: var(--faint); flex: none; }
.search input { flex: 1; border: 0; background: none; outline: none; height: 100%; min-width: 0; }
.search kbd { font-family: var(--mono); font-size: 11px; color: var(--faint); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; }
.count { color: var(--faint); font-size: 13px; white-space: nowrap; }
.groups { display: flex; flex-direction: column; gap: 14px; }
.grp .section-hd h2 { font-family: var(--mono); font-weight: 550; font-size: 12px; color: var(--muted); letter-spacing: 0; }
.grp .row { grid-template-columns: 26px 44px minmax(0, 1fr) auto 64px auto; }
.empty { text-align: center; padding: 60px 20px; color: var(--faint); }

/* ---------- Manuals ---------- */
.manuals { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 24px; align-items: start; }
.doclist { display: flex; flex-direction: column; gap: 6px; position: sticky; top: 84px; }
.doc {
  display: flex; align-items: center; gap: 12px; text-align: left; width: 100%;
  background: none; border: 1px solid transparent; border-radius: 10px; padding: 10px 12px;
}
.doc:hover { background: var(--panel); border-color: var(--line); }
.doc[aria-pressed="true"] { background: var(--panel); border-color: var(--line-strong); }
.doc .num {
  width: 30px; height: 30px; border-radius: 8px; flex: none; display: grid; place-items: center;
  background: var(--panel-2); border: 1px solid var(--line); font-weight: 700; font-size: 12px; color: var(--muted);
}
.doc[aria-pressed="true"] .num { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.doc b { display: block; font-weight: 600; }
.doc small { color: var(--faint); font-size: 12px; }
.doclist h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 4px 6px; }
.thumbs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.thumbs button { padding: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #9aa0a8; aspect-ratio: 1.6; }
.thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pdfwrap { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.pdfbar { display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 18px; border-bottom: 1px solid var(--line); }
.pdfbar b { font-weight: 600; }
.pdfbar .btn { margin-left: auto; }
.pdfwrap iframe { display: block; width: 100%; height: calc(100vh - 170px); min-height: 520px; border: 0; background: #525659; }

/* ---------- Preview panel ---------- */
.scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, .45); z-index: 40; opacity: 0; pointer-events: none; transition: opacity .2s; }
.scrim.open { opacity: 1; pointer-events: auto; }
.pv {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 50; width: min(760px, 100vw);
  background: var(--panel); border-left: 1px solid var(--line); box-shadow: var(--shadow);
  display: flex; flex-direction: column; transform: translateX(102%); transition: transform .25s cubic-bezier(.2, .8, .2, 1);
}
.pv.open { transform: none; }
.pv-hd { display: flex; align-items: center; gap: 8px; padding: 12px 12px 12px 20px; border-bottom: 1px solid var(--line); }
.pv-hd .meta { flex: 1; }
.pv-hd .nm { font-size: 15px; }
.pv-stage { position: relative; flex: 1; min-height: 0; background: radial-gradient(ellipse at 50% 40%, var(--panel-2), var(--bg)); overflow: hidden; }
.pv-stage canvas { position: absolute; inset: 0; width: 100% !important; height: 100% !important; touch-action: none; }
.pv-stage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; padding: 16px; }
.pv-stage.drag { box-shadow: inset 0 0 0 2px var(--accent); }
.pv-msg { position: absolute; inset: 0; display: grid; place-items: center; padding: 32px; text-align: center; color: var(--muted); }
.pv-msg[hidden] { display: none; }
.pv-msg .box { max-width: 420px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.pv-msg h3 { margin: 0; color: var(--text); font-size: 16px; }
.pv-msg p { margin: 0; line-height: 1.6; font-size: 13.5px; }
.pv-msg code { font-family: var(--mono); font-size: 12.5px; background: var(--panel-2); border: 1px solid var(--line); padding: 1px 6px; border-radius: 5px; color: var(--text); }
.spinner { width: 28px; height: 28px; border-radius: 50%; border: 2.5px solid var(--line-strong); border-top-color: var(--accent); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.pv-ft { display: flex; align-items: center; gap: 8px; padding: 10px 12px 10px 20px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.pv-stats { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; flex: 1 1 200px; }
.pv-btns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; margin-left: auto; }
.pv-btns .btn[hidden] { display: none; }
.pv-stats b { color: var(--text); font-weight: 600; }
.pv-hint { position: absolute; right: 12px; bottom: 10px; font-size: 11.5px; color: var(--faint); pointer-events: none; }
.toast {

}

.colors { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 24px; align-items: start; }

.col-hint { flex: 1; color: var(--faint); font-size: 12.5px; text-align: right; }
.col-stage {
  position: relative; height: min(84vh, 880px); min-height: 420px; overflow: hidden;
  border: 1px solid var(--line); border-radius: var(--radius);
  background: radial-gradient(ellipse at 50% 25%, #eceded, #bfc2c7);

.col-stage canvas { position: absolute; inset: 0; width: 100% !important; height: 100% !important; touch-action: none; }
.col-labels { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
.col-msg { position: absolute; inset: 0; display: grid; place-items: center; z-index: 3; padding: 24px; text-align: center; color: #2a2d31; font-weight: 600; }
.col-msg .box { background: rgba(255, 255, 255, .92); border-radius: 12px; padding: 16px 20px; max-width: 420px; font-weight: 500; }
.col-msg h3 { margin: 0 0 6px; font-size: 15px; }
.col-tip { position: absolute; left: 0; top: 0; z-index: 4; pointer-events: none; background: rgba(24, 25, 27, .9); color: #fff; font-size: 12px; font-weight: 600; padding: 4px 9px; border-radius: 7px; white-space: nowrap; }
.col-hint { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.tpl { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.tplchip { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.tplchip button { border: 0; background: none; padding: 5px 10px; font-size: 13px; color: var(--muted); }
.tplact { display: flex; gap: 8px; margin-top: 8px; }
.tplact .btn { flex: 1; justify-content: center; }
.tplchip button { display: inline-flex; align-items: center; gap: 6px; }
.tplchip .dots { display: inline-flex; gap: 3px; }
.tplchip .sw { width: 12px; height: 12px; }
.tplchip button:hover { color: var(--text); }
.tplchip:has(> button[aria-pressed="true"]) { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
.tplchip button[aria-pressed="true"] { color: var(--text); }
.tplchip .x { padding: 5px 9px 5px 2px; color: var(--faint); }
.col-note { color: var(--faint); font-size: 12px; margin: 0; }
.sw { width: 14px; height: 14px; border-radius: 50%; border: 1px solid rgba(128, 128, 128, .55); flex: none; display: inline-block; }
.plist { display: flex; flex-direction: column; gap: 4px; }
.prow {
  display: grid; grid-template-columns: 14px minmax(0, 1fr) auto auto; gap: 10px; align-items: center; text-align: left;
  border: 1px solid var(--line); background: none; border-radius: 9px; padding: 8px 10px; color: var(--text);
}
.prow:hover { border-color: var(--line-strong); }
.prow[aria-pressed="true"] { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 55%, transparent); }
.prow .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prow .cn { color: var(--muted); font-size: 12px; min-width: 64px; text-align: right; }
.palette { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.palette button {
  display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 9px 4px 7px;
  border: 1px solid var(--line); border-radius: 10px; background: var(--panel-2); color: var(--muted); font-size: 11.5px; line-height: 1.2; text-align: center;
}
.palette button:hover { border-color: var(--line-strong); color: var(--text); }
.palette button[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); color: var(--text); }

@media (max-width: 960px) {
  .colors { grid-template-columns: 1fr; }
  .col-main { order: -1; }
    .builder, .manuals { grid-template-columns: 1fr; }
  .config, .doclist, .bcol { position: static; max-height: none; overflow: visible; }
  .brand-sub { display: none; }
}
@media (max-width: 640px) {
  .top-inner { padding: 0 16px; gap: 12px; height: auto; flex-wrap: wrap; padding-top: 10px; }

  .top-actions .pill span { display: none; }
  main { padding: 16px; }
  .summary { grid-template-columns: 1fr; }
  .summary .acts { justify-content: flex-start; }
  .row, .grp .row { grid-template-columns: 22px 40px minmax(0, 1fr) 36px auto; padding-left: 12px; gap: 8px; }

  .row .badges, .row .sz { display: none; }

  .col-stage { height: 64vh; min-height: 380px; }
  .palette { grid-template-columns: repeat(3, 1fr); }
  .spec b { font-size: 14px; white-space: normal; }
  .grp .row { grid-template-columns: 22px 40px minmax(0, 1fr) auto; }
}

const printed = new Set(store.get('printed', []));

/* ---------- Builder state ---------- */
const WIDTHS = ['S', 'M', 'L', 'XL'];
const DEPTHS = [3, 4, 5, 6, 7];
const HEIGHTS = ['1F', '2F', '4F'];
// Published USSA specs (mm). Inside length is given for x3; every depth step adds one 42 mm Gridfinity unit.
const SPEC = {

const mm = v => (Math.round(v * 10) / 10).toString();
const state = Object.assign(
  { type: 'drawer', w: 'S', d: 3, h: '1F', count: 1, lock: 'key', roof: '', handle: false, base: '', variant: '', lid: 'whole', locks: 1, dividers: false, sbase: false },
  store.get('state', {}),
);

const D_FAM = w => `^01\\. DRAWERS/\\d\\d\\. ${w} Families/`;
const S_FAM = w => `^02\\. SUSTAINERS/\\d\\d\\. ${w} Families/`;
const D_UNI = '^01\\. DRAWERS/07\\. Universal/';
const S_UNI = '^02\\. SUSTAINERS/05\\. Universal/';

const drawerModule = (w, d, h) => first(`${D_FAM(w)}${w}${d}/Modules/${w}${d} Module ${h}\\.stl$`);
const sustainerModules = (w, d, h) => find(`${S_FAM(w)}${w}${d}/Modules/${w}${d} ${h} (\\w+ )?Module ?\\.stl$`);
const available = (w, d, h) => state.type === 'drawer' ? !!drawerModule(w, d, h) : sustainerModules(w, d, h).length > 0;

function normalizeState() {
  if (!WIDTHS.includes(state.w)) state.w = 'S';
  state.d = Number(state.d);
  if (!HEIGHTS.some(h => available(state.w, state.d, h))) state.d = DEPTHS.find(d => HEIGHTS.some(h => available(state.w, d, h))) ?? 3;
  if (!available(state.w, state.d, state.h)) state.h = HEIGHTS.find(h => available(state.w, state.d, h)) ?? '1F';
  state.count = Math.min(99, Math.max(1, state.count | 0));
  state.locks = Math.min(4, Math.max(0, state.locks | 0));
  if (state.type === 'drawer') {
    if (!drawerRoofs().some(r => r.id === state.roof)) state.roof = '';
    if (!drawerBaseplates().some(b => b.id === state.base)) state.base = '';
  } else {
    const variants = sustainerVariants();
    if (!variants.some(v => v.id === state.variant)) state.variant = variants[0]?.id ?? '';
    const lids = sustainerLids();
    if (!lids.some(l => l.id === state.lid)) state.lid = lids[0]?.id ?? 'whole';
  }
}

// "Part 1 / Part 2" files belong to one choice; duplicates of a single-piece choice keep the first file.
function choice(id, label, files) {
  const parts = files.filter(f => /Part \d/i.test(f.name));
  return { id, label, files: parts.length ? parts : files.slice(0, 1) };
}
function groupChoices(files, keyOf, labelOf) {
  const m = new Map();
  for (const f of files) { const k = keyOf(f); if (!m.has(k)) m.set(k, []); m.get(k).push(f); }
  return [...m].map(([k, fs]) => choice(k, labelOf(k), fs));
}
function drawerRoofs() {
  const { w, d } = state;
  return groupChoices(find(`${D_FAM(w)}${w}${d}/Roofs?/.*\\.stl$`),
    f => f.name.replace(new RegExp(`^${w}${d} `, 'i'), '').replace(/\.stl$/i, ''),
    k => k.replace('Heawyweight', 'Heavyweight').replace(/ Roof$/, ''));
}
function baseplates(files) {
  const order = ['plain', 'oneHandle', 'twoHandles'];
  return groupChoices(files, f => /2.?Handles/i.test(f.name) ? 'twoHandles' : /1 Handle/i.test(f.name) ? 'oneHandle' : 'plain', k => t(k))
    .sort((a, b) => order.indexOf(a.id) - order.indexOf(b.id));
}
const drawerBaseplates = () => baseplates(find(`${D_FAM(state.w)}${state.w}${state.d}/Gridfinity Baseplate/.*\\.stl$`));
function sustainerLids() {
  const files = find(`${S_FAM(state.w)}${state.w}${state.d}/Roofs?/.*\\.stl$`);
  const split = files.filter(f => /Part \d|Connector/i.test(f.name));
  const whole = files.filter(f => !/Part \d|Connector/i.test(f.name));
  const out = [];
  if (whole.length) out.push({ id: 'whole', label: t('whole'), files: whole.slice(0, 1) });
  if (split.length) out.push({ id: 'split', label: t('split'), files: split });
  return out;
}
function sustainerVariants() {
  return sustainerModules(state.w, state.d, state.h).map(f => {
    const m = f.name.match(/ (\w+) Module/);
    const id = m && m[1] !== state.h ? m[1] : '';
    return { id, label: id || '—', file: f };
  });
}

/* ---------- Part lists ---------- */
const part = (f, qty = 1, extra = {}) => f ? { f, qty, ...extra } : { missing: extra.expect || '?', qty };

function drawerSections() {
  const { w, d, h, count } = state;
  const dir = `${D_FAM(w)}${w}${d}/`;
  const boxes = find(`${dir}Boxes/${w}${d} (Box ${h}( Part \\d)?|Back Panel)\\.stl$`);
  const body = [
    part(drawerModule(w, d, h), 1, { expect: `${w}${d} Module ${h}` }),
    ...(boxes.length ? boxes.map(f => part(f)) : [part(null, 1, { expect: `${w}${d} Box ${h}` })]),
    part(first(`${D_FAM(w)}(Facades/${w}${h} .*|${w} Facade ${h})\\.stl$`), 1, { expect: `${w}${h} Facade` }),
  ];
  const run = w === 'XL' ? `XL${d}` : `x${d}`;
  const lockFiles = state.lock === 'hidden'
    ? [part(first(`${D_UNI}Hidden Key \\(`), 1, { expect: 'Hidden Key' }), part(first(`${D_UNI}Hidden Key Part 2`), 1, { expect: 'Hidden Key Part 2' })]
    : [part(first(`${D_UNI}Key \\(`), 1, { expect: 'Key' })];
  const mech = [
    part(first(`${D_UNI}Geared Rails/${w} Rails\\.stl$`), 1, { pcs: 2, expect: `${w} Rails` }),
    part(first(`${D_UNI}Runners/${run} Runner Guides\\.stl$`), 1, { pcs: 2, expect: `${run} Runner Guides` }),
    part(first(`${D_UNI}Runners/${run} Runner Slides\\.stl$`), 1, { pcs: 2, expect: `${run} Runner Slides` }),
    part(first(`${D_UNI}Runners/Runner Stopper\\.stl$`), 2, { expect: 'Runner Stopper' }),
    part(first(`${D_UNI}Latch\\.stl$`), 1, { expect: 'Latch' }),
    part(first(`${D_UNI}Springs\\.stl$`), 1, { pcs: 2, expect: 'Springs' }),
    ...lockFiles,
    part(first(`${D_UNI}Key Cap\\.stl$`), 1, { expect: 'Key Cap' }),
    part(first(`${D_UNI}Facade Cap\\.stl$`), 1, { expect: 'Facade Cap' }),
    part(first(`${D_UNI}Label\\.stl$`), 1, { expect: 'Label' }),
  ];
  const top = [];
  const roof = drawerRoofs().find(r => r.id === state.roof);
  if (roof) {
    top.push(...roof.files.map(f => part(f, 1, { once: true })));
    if (/Heawyweight/i.test(roof.id)) {
      top.push(part(first(`${D_UNI}Heawyweight Roof Handle`), 1, { once: true }), part(first(`${D_UNI}Heawyweight Roof Insert`), 1, { once: true }));
    }
  }
  if (state.handle) top.push(part(first(`${D_UNI}Top Handle`), 1, { once: true, expect: 'Top Handle' }));
  const opt = [];
  const base = drawerBaseplates().find(b => b.id === state.base);
  if (base) opt.push(...base.files.map(f => part(f)));
  const bolts = h === '1F' ? 4 : 6;
  return [
    { title: t('secBody'), items: body },
    { title: t('secMech'), items: mech },
    top.length && { title: t('secTop'), sub: t('secTopNote'), items: top },
    opt.length && { title: t('secOpt'), items: opt },
    { title: t('secHw'), items: [
      { hw: t('bolts'), sub: t('boltsNote', bolts), qty: bolts * count, raw: true },
      (state.handle || /Heawyweight/i.test(state.roof)) && { hw: t('m6'), sub: t('m6Note'), qty: null },
    ].filter(Boolean) },
  ].filter(Boolean);
}

function sustainerDividers() {
  const { w, d, h } = state, dv = `${S_UNI}Dividers/`;
  if (w === 'S' || w === 'M') return find(`${dv}${w} Dividers/${w}${h} Divider\\.stl$`);
  if (w === 'L') return find(`${dv}L (Depth Dividers/L${d}-${h} Depth|Width Dividers/L-${h} Width|Seal Dividers/L-${h} Seal) Divider\\.stl$`);
  return find(`${dv}(XL Depth Dividers/XL${d} Depth Divider|XL Width Divider|XL Seal Divider \\(\\w+\\))\\.stl$`);
}
const sustainerBaseplates = () => find(`${S_UNI}Baseplates/[^/]+/${state.w}${state.d}( Part \\d)? +(Gridfinity )?Baseplate\\.stl$`);

function sustainerSections() {
  const { w, d, h } = state;
  const sm = w === 'S' || w === 'M';
  const variants = sustainerVariants();
  const mod = variants.find(v => v.id === state.variant) || variants[0];
  const lids = sustainerLids();
  const lid = lids.find(l => l.id === state.lid) || lids[0];
  const body = [
    part(mod?.file, 1, { expect: `${w}${d} ${h} Module` }),
    part(first(`${S_FAM(w)}(Facades/)?${w}${h}'? Facade\\.stl$`), 1, { expect: `${w}${h} Facade` }),
    ...(lid ? lid.files.map(f => part(f)) : [part(null, 1, { expect: `${w}${d} Roof` })]),
  ];
  const hingeSize = sm ? 'S-M' : (h === '1F' ? 'L-XL' : 'L');
  const hinge = [
    part(first(`${S_UNI}Hinges/${hingeSize} ${h === '1F' ? '1F' : '2-4F'} Hinge\\.stl$`), 1, { pcs: 2, expect: `${hingeSize} Hinge` }),
    part(first(`${S_UNI}Hinges/${sm ? w : 'L-XL'} Hinge Top\\.stl$`), 1, { pcs: sm ? 0 : 2, expect: 'Hinge Top' }),
    part(first(`${S_UNI}Rods/${sm ? 'S-M' : 'L-XL'} Rods\\.stl$`), 1, { pcs: 2, expect: 'Rods' }),
    part(first(`${S_UNI}Label for Sustainers`), 1, { expect: 'Label for Sustainers' }),
  ];
  const lock = state.locks ? [
    part(first(`${S_UNI}Locks/LOCK HOLDER`), state.locks),
    part(first(`${S_UNI}Locks/LOCK INNER PART`), state.locks),
    part(first(`${S_UNI}Locks/LOCK OUTER PART ${h === '1F' ? '1F' : '2-4F'}`), state.locks),
    part(first(`${S_UNI}Locks/1 SET OF PINS`), state.locks, { pcs: 4 }),
  ] : [];
  const opt = [];
  if (state.dividers) opt.push(...sustainerDividers().map(f => part(f, null)));
  if (state.sbase) opt.push(...sustainerBaseplates().map(f => part(f)));
  return [
    { title: t('secBody'), items: body },
    { title: t('secHinge'), items: hinge },
    lock.length && { title: t('secLock'), sub: t('secLockNote', state.locks), items: lock, raw: true },
    opt.length && { title: t('secOpt'), items: opt },
    { title: t('secHw'), items: [{ hw: t('bolts'), sub: t('boltsSus'), qty: null }] },
  ].filter(Boolean);
}

/* ---------- Rendering helpers ---------- */
const thumbSrc = f => isImage(f) ? fileUrl(f.p) : f.th ? `_hub/thumbs/${f.th}.webp` : '';
const thumb = (f, icon = ICON.cube) => {
  const src = f && thumbSrc(f);
  const inner = src ? `<img src="${esc(src)}" alt="" loading="lazy">` : icon;
  return f ? `<button class="thumb" data-act="open" tabindex="-1" aria-hidden="true">${inner}</button>` : `<span class="thumb">${inner}</span>`;
};
const prettyName = n => n.replace(/\.stl$/i, '').replace(/\s*\(turn on supports\)/i, '').replace(/\s+/g, ' ').trim();

// Suggested filament finish: 'matte', 'basic' or 'tpu'; '' = no recommendation.
const MATERIAL_PATHS = [
  [/^03\. MODIFICATIONS\/Wheels\/Cover/, 'matte'],
  [/^03\. MODIFICATIONS\/(Wheels|Backbone|Feet|Pegboard Attachment|Wall Mounts|Base)\//, 'basic'],
  [/\/Grid Dividers\//, 'matte'],
  [/\/L\u00b2 Accessories\//, 'basic'],
  [/\/Manual Supports\//, 'basic'],
  [/^02\. SUSTAINERS\/05\. Universal\/(Hinges|Rods|Locks)\//, 'basic'],
];
function material(f) {
  if (!isModel(f)) return '';
  if (/Tyre|TPU/i.test(f.name)) return 'tpu';
  for (const [re, m] of MATERIAL_PATHS) if (re.test(f.p)) return m;
  if (/Handle|Runner|Key|Latch|Spring|Rail|Label|Facade Cap/i.test(f.name)) return 'basic';
  if (/Module|Box|Back Panel|Roof|Baseplate|Divider|Facade/i.test(f.name) || /\/Facades?\//.test(f.p)) return 'matte';
  return '';
}
// Which part of the Colors tab a file belongs to, so its Matte / Basic tag can show the color picked there.
// Matte parts without a role of their own follow the body color; basic parts without a role (runners, springs, hinges...) show no color.
function colorRole(f) {
  const m = material(f), n = f.name;
  if (m === 'matte') return /Facade/i.test(n) || /\/Facades?\//.test(f.p) ? 'facade' : /Roof/i.test(n) ? 'roof' : 'body';
  if (m !== 'basic') return '';
  if (/Key Cap/i.test(n)) return 'keycap';
  if (/Key/i.test(n)) return 'key';
  if (/Handle/i.test(n)) return 'handle';
  if (/Label/i.test(n)) return 'label';
  if (/Runner Stopper/i.test(n)) return 'stopper';
  if (/LOCK /i.test(n) || /\/Locks\//.test(f.p)) return 'lock';
  return '';
}
const matBadge = (m, cls = '', f = null) => {
  if (!m) return '';
  const role = f ? colorRole(f) : '', c = role ? colorOf(role) : null;
  // The whole tag takes the picked color (with light or dark text for contrast); parts without a color role keep the plain tag.
  const paint = c ? ` style="background:${c.hex};color:${isDarkHex(c.hex) ? '#fff' : '#18191b'};border-color:rgba(128,128,128,.5)"` : '';
  return `<span class="badge mat ${m}${cls}"${paint} title="${esc(t(m + 'Tip') + (c ? ' · ' + colorName(c) : ''))}">${esc(t(m))}</span>`;
};

function badges(f, item = {}) {
  const b = [];
  if (/turn on supports/i.test(f.name)) b.push(`<span class="badge sup">${t('supports')}</span>`);
  if (item.pcs) b.push(`<span class="badge pcs">${t('pcs', item.pcs)}</span>`);
  if (!isModel(f)) b.push(`<span class="badge muted">${ext(f).toUpperCase()}</span>`);
  if (item.mat) b.push(matBadge(material(f), '', f));   // the material tag comes last
  return b.join('');
}

function fileRow(f, item = null) {
  const done = printed.has(f.p);
  let qty = '';
  if (item) {
    if (item.qty == null) qty = `<span class="qty na">${t('asNeeded')}</span>`;
    else qty = `<span class="qty">×${item.once || item.raw ? item.qty : item.qty * state.count}</span>`;
  }
  const canCheck = isModel(f);
  return `<li class="row${done ? ' done' : ''}" data-path="${esc(f.p)}">
    ${canCheck ? `<label class="ck"><input type="checkbox" data-act="check"${done ? ' checked' : ''} aria-label="${esc(t('markPrinted'))}"><span></span></label>` : '<span></span>'}
    ${thumb(f, isModel(f) ? ICON.cube : ICON.eye)}
    <button class="meta" data-act="open" title="${esc(f.p)}"><span class="nm">${esc(prettyName(f.name))}</span><span class="pt">${esc(f.dir)}</span>${matBadge(material(f), ' mat-sm', f)}</button>
    <span class="badges">${badges(f, { ...item, mat: true })}</span>
    ${item ? qty : ''}
    <span class="sz">${fmtSize(f.s)}</span>
    <span class="acts-row">
      <button class="ib" data-act="open" title="${esc(t('preview'))}">${isModel(f) ? ICON.cube : ICON.eye}</button>
      <button class="ib" data-act="reveal" title="${esc(t('reveal'))}" aria-label="${esc(t('reveal'))}">${ICON.folder}</button>
    </span>
  </li>`;
}

  const { type, w, d, h } = state;
  const ins = SPEC.inside[type];
  const outer = `${mm(SPEC.width[w])} × ${SPEC.length(d)} × ${SPEC.height[type][h]}`;
  const inside = ins.width[w] ? `${ins.width[w]} × ${ins.length(d)} × ${ins.height[h]}` : '—';
  const pr = SPEC.print[type][w];
  const est = pr?.[h];
  const cell = (label, value, sub = '') => `<div class="spec"><span>${esc(label)}</span><b>${value}</b>${sub ? `<small>${esc(sub)}</small>` : ''}</div>`;
  return `<div class="specs">
    ${cell(t('specOuter'), `${outer} <i>mm</i>`, t('specWLH'))}
    ${cell(t('specInside'), inside === '—' ? '—' : `${inside} <i>mm</i>`, t('specWLH'))}
    ${cell(t('specGrid'), `${SPEC.gridWidth[w]} × ${d}`, t('specGridSub'))}
    ${est ? cell(t('specPrint', h), `${est[0]} <i>h</i> · ${est[1]} <i>g</i>`, d === 3 ? t('specPerUnit') : t('specX3')) : ''}
    ${pr?.roof ? cell(t('specRoof'), `${pr.roof[0]} <i>h</i> · ${pr.roof[1]} <i>g</i>`, d === 3 ? t('specOnce') : t('specX3')) : ''}

function toast(msg) {

  el.classList.add('show');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => el.classList.remove('show'), 1800);

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); }
  catch {
    const ta = Object.assign(document.createElement('textarea'), { value: text });
    document.body.append(ta); ta.select(); document.execCommand('copy'); ta.remove();
  }
}
document.addEventListener('change', e => {
  if (e.target.dataset.act !== 'check') return;
  const row = e.target.closest('[data-path]');
  const p = row.dataset.path;
  e.target.checked ? printed.add(p) : printed.delete(p);
  savePrinted();
  $$(`[data-path="${CSS.escape(p)}"]`).forEach(r => {
    r.classList.toggle('done', e.target.checked);
    const cb = r.querySelector('input[data-act="check"]');
    if (cb) cb.checked = e.target.checked;
  });
  if (row.closest('#results')) renderResults();
});
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.tagName === 'INPUT') return;
  const act = el.dataset.act;
  if (act === 'open') {
    const row = el.closest('[data-path]');
    const container = row.closest('[data-list]') || row.parentElement;
    const paths = [...new Set($$('[data-path]', container).map(r => r.dataset.path))];
    const f = BY_PATH.get(row.dataset.path);
    if (f.name.toLowerCase().endsWith('.pdf')) { manual = f.p; store.set('manual', f.p); showTab('manuals'); return; }
    openPreview(paths.map(p => BY_PATH.get(p)).filter(x => isModel(x) || isImage(x)), f);
  } else if (act === 'copy') {
    const sections = state.type === 'drawer' ? drawerSections() : sustainerSections();
    const lines = [`${state.w}${state.d} ${state.h} ${state.type === 'drawer' ? t('drawer') : t('sustainer')} × ${state.count}`];
    for (const s of sections) {
      lines.push('', `## ${s.title}`);
      for (const i of s.items) {
        const q = i.qty == null ? t('asNeeded') : '×' + (i.once || i.raw || s.raw ? i.qty : i.qty * state.count);
        lines.push(`[${i.f && printed.has(i.f.p) ? 'x' : ' '}] ${q}  ${i.f ? i.f.p : i.hw || i.missing}${i.f && material(i.f) ? `  (${t(material(i.f))})` : ''}`);
      }
    }
    await copyText(lines.join('\n'));
    toast(t('copied'));
  } else if (act === 'reveal') {
    reveal(el.closest('[data-path]').dataset.path);
  } else if (act === 'gather') {
    if (!HUB) { toast(t('needsHub')); return; }
    const name = `${state.w}${state.d} ${state.h} ${state.type === 'drawer' ? 'Drawer' : 'Sustainer'}`;
    try {
      const res = await hubCall('/api/gather', { name, paths: JSON.parse($('#results').dataset.files || '[]') });
      toast(t('gathered', res.folder));
    } catch (err) { toast(err.message); }
  } else if (act === 'clear') {
    JSON.parse($('#results').dataset.files || '[]').forEach(p => printed.delete(p));
    savePrinted();
    renderResults();
  }
});

/* ---------- Local hub actions ---------- */
// The launcher's server can reveal files in Finder/Explorer; a plain page can only copy the path.
let HUB = false;
async function hubCall(route, body) {
  const res = await fetch(route, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Vault-Hub': '1' }, body: JSON.stringify(body) });
  const json = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(json.error || res.statusText);
  return json;
}
function absolutePath(p) {
  if (!LOCAL) return p;
  const dir = decodeURIComponent(location.pathname).replace(/[^/]*$/, '');
  const full = dir + p;
  return /^\/[A-Za-z]:/.test(full) ? full.slice(1).replace(/\//g, '\\') : full;
}
async function reveal(p) {
  if (HUB) { try { await hubCall('/api/reveal', { path: p }); } catch (err) { toast(err.message); } return; }
  await copyText(absolutePath(p));
  toast(t('pathCopied'));
}
if (!LOCAL) {
  fetch('api/ping').then(r => r.ok ? r.json() : null).then(j => { HUB = !!j?.ok; renderChrome(); }).catch(() => {});
}

/* ---------- Preview ---------- */
const pv = { list: [], index: 0, token: 0, viewer: null, wire: false };

async function loadViewer() {
  if (pv.viewer) return pv.viewer;
  const THREE = await import('three');
  const { STLLoader } = await import('three/addons/loaders/STLLoader.js');
  const { OrbitControls } = await import('three/addons/controls/OrbitControls.js');
  const stage = $('#pv-stage');
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  stage.prepend(renderer.domElement);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 10000);
  scene.add(camera, new THREE.HemisphereLight(0xffffff, 0x50545c, 1.5));
  const key = new THREE.DirectionalLight(0xffffff, 2.4);
  key.position.set(0.6, 1, 0.8);
  camera.add(key);
  const rim = new THREE.DirectionalLight(0xffffff, 0.8);
  rim.position.set(-1, 0.4, -1);
  scene.add(rim);
  const css = getComputedStyle(document.documentElement);
  const material = new THREE.MeshStandardMaterial({ color: new THREE.Color(css.getPropertyValue('--model').trim()), roughness: 0.55, metalness: 0.05 });
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  let mesh = null, grid = null, home = null;
  const resize = () => {
    const { clientWidth: w, clientHeight: h } = stage;
    if (!w || !h) return;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  };
  new ResizeObserver(resize).observe(stage);
  renderer.setAnimationLoop(() => { if (pv.open) { controls.update(); renderer.render(scene, camera); } });
  const viewer = {
    show(buffer) {
      if (mesh) { scene.remove(mesh); mesh.geometry.dispose(); }
      if (grid) { scene.remove(grid); grid.geometry.dispose(); }
      const g = new STLLoader().parse(buffer);
      g.rotateX(-Math.PI / 2);
      g.computeVertexNormals();
      g.computeBoundingBox();
      const c = g.boundingBox.getCenter(new THREE.Vector3());
      g.translate(-c.x, -g.boundingBox.min.y, -c.z);
      g.computeBoundingBox();
      const size = g.boundingBox.getSize(new THREE.Vector3());
      mesh = new THREE.Mesh(g, material);
      scene.add(mesh);
      const span = Math.ceil(Math.max(size.x, size.z) * 1.6 / 10) * 10;
      grid = new THREE.GridHelper(span, span / 10, css.getPropertyValue('--grid').trim(), css.getPropertyValue('--grid').trim());
      grid.material.transparent = true;
      grid.material.opacity = 0.22;
      scene.add(grid);
      const radius = size.length() / 2;
      const dist = radius / Math.sin(THREE.MathUtils.degToRad(camera.fov / 2)) * 1.05;
      controls.target.set(0, size.y / 2, 0);
      camera.position.set(dist * 0.62, size.y / 2 + dist * 0.48, dist * 0.62);
      camera.near = dist / 100;
      camera.far = dist * 20;
      camera.updateProjectionMatrix();
      home = camera.position.clone();
      controls.update();
      resize();
      return { x: size.x, y: size.z, z: size.y, tris: g.attributes.position.count / 3 };
    },
    reset() { if (home) { camera.position.copy(home); controls.update(); } },
    wire(on) { material.wireframe = on; },
  };
  pv.viewer = viewer;
  return viewer;
}

function message(html) { const m = $('#pv-msg'); m.innerHTML = html ? `<div class="box">${html}</div>` : ''; m.hidden = !html; }

}

  catch { message(`<h3>${esc(t('failTitle'))}</h3>`); }
}

async function openPreview(list, f) {
  pv.list = list.length ? list : [f];
  pv.index = Math.max(0, pv.list.findIndex(x => x.p === f.p));
  pv.open = true;
  $('#pv').classList.add('open');
  $('#pv').setAttribute('aria-hidden', 'false');
  $('#scrim').classList.add('open');
  await showCurrent();
}
function closePreview() {
  pv.open = false;
  pv.token++;
  $('#pv').classList.remove('open');
  $('#pv').setAttribute('aria-hidden', 'true');
  $('#scrim').classList.remove('open');
}
function step(n) {
  if (!pv.open || pv.list.length < 2) return;
  pv.index = (pv.index + n + pv.list.length) % pv.list.length;
  showCurrent();
}
async function showCurrent() {
  const f = pv.list[pv.index];
  const token = ++pv.token;
  $('#pv-name').textContent = prettyName(f.name);
  $('#pv-path').textContent = f.p;
  pv.path = f.p;
  $('#pv-reveal').innerHTML = `${ICON.folder}<span>${esc(t('reveal'))}</span>`;
  $('#pv-app').hidden = !HUB || !isModel(f);
  $('#pv-prev').hidden = $('#pv-next').hidden = pv.list.length < 2;
  $('#pv-hint').hidden = true;
  setStats(null);
  const canvas = $('#pv-stage canvas');
  const img = $('#pv-img');
  if (isImage(f)) {
    if (canvas) canvas.style.visibility = 'hidden';
    img.hidden = false;
    img.src = fileUrl(f.p);
    message('');
    $('#pv-reset').hidden = $('#pv-wire').hidden = true;
    return;
  }
  img.hidden = true;
  img.removeAttribute('src');
  $('#pv-reset').hidden = $('#pv-wire').hidden = true;
  message(`<div class="spinner"></div><p>${esc(t('loading'))}</p>`);
  let viewer;
  try { viewer = await loadViewer(); }
  catch { if (token === pv.token) message(`<h3>${esc(t('offlineTitle'))}</h3><p>${esc(t('offlineBody'))}</p>`); return; }
  if (token !== pv.token) return;
  const c = $('#pv-stage canvas');
  c.style.visibility = 'hidden';
  let buffer;
  try {
    const res = await fetch(fileUrl(f.p));
    if (!res.ok) throw new Error(res.status);
    buffer = await res.arrayBuffer();
  } catch {
    if (token !== pv.token) return;
    message(`<h3>${esc(t('blockedTitle'))}</h3><p>${t('blockedBody')}</p><button class="btn" data-pick>${esc(t('pick'))}</button>`);
    return;
  }
  if (token !== pv.token) return;
  c.style.visibility = 'visible';
  showStl(buffer);
}

async function showLocalFile(file) {
  if (!file || !/\.stl$/i.test(file.name)) return;
  const token = ++pv.token;
  message(`<div class="spinner"></div><p>${esc(t('loading'))}</p>`);
  try { await loadViewer(); } catch { message(`<h3>${esc(t('offlineTitle'))}</h3><p>${esc(t('offlineBody'))}</p>`); return; }
  const buffer = await file.arrayBuffer();
  if (token !== pv.token) return;
  $('#pv-img').hidden = true;
  $('#pv-stage canvas').style.visibility = 'visible';
  $('#pv-name').textContent = prettyName(file.name);
  showStl(buffer);
}

// Display colors for choosing filament.
const PALETTE = {
  matte: [
    { id: 'white', hex: '#FFFFFF' }, { id: 'black', hex: '#000000' }, { id: 'lime', hex: '#C0DF16' },
    { id: 'grey', hex: '#7F7E83' }, { id: 'pink', hex: '#FABBCB' }, { id: 'lightblue', hex: '#B9D9EB' },
    { id: 'violet', hex: '#A7A4E0' }, { id: 'avocado', hex: '#BCE194' },
  ],
  basic: [
    { id: 'orange', hex: '#FF671D' }, { id: 'red', hex: '#D6001C' }, { id: 'yellow', hex: '#FCE400' }, { id: 'green', hex: '#00963A' },
    { id: 'blue', hex: '#0285D7' }, { id: 'darkblue', hex: '#001489' }, { id: 'white', hex: '#FFFFFF' }, { id: 'beige', hex: '#DBC8B7' },
    { id: 'black', hex: '#000000' }, { id: 'brown', hex: '#502C1E' }, { id: 'grey', hex: '#7F7E83' }, { id: 'bluegrey', hex: '#688197' },
    { id: 'darkgreen', hex: '#044537' },
  ],
};
// What gets a color: the finish of each role follows the Matte / Basic tags above.
const ROLE_FINISH = { body: 'matte', facade: 'matte', roof: 'matte', handle: 'basic', key: 'basic', keycap: 'basic', lock: 'basic', label: 'basic', stopper: 'basic' };
const ROLE_DEFAULT = { body: 'white', facade: 'white', roof: 'white', handle: 'black', key: 'black', keycap: 'white', lock: 'black', label: 'white', stopper: 'orange' };
const ROLES = Object.keys(ROLE_FINISH);
const isDarkHex = hex => { const n = parseInt(hex.slice(1), 16); return (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) < 120; };
const colorUI = (() => {
  const saved = store.get('colors', {});
  return { role: ROLE_FINISH[saved.role] ? saved.role : 'body', choice: saved.choice && !saved.choice.drawer ? saved.choice : {} };
})();
const saveColors = () => store.set('colors', colorUI);
const colorOf = role => PALETTE[ROLE_FINISH[role]].find(c => c.id === colorUI.choice[role]) ?? PALETTE[ROLE_FINISH[role]].find(c => c.id === ROLE_DEFAULT[role]);
const colorName = c => t('c_' + c.id);
const col = { enginePromise: null, engine: null, tower: null, home: null };

// Templates: named sets of color picks kept in this browser, loaded with one click.
const templates = () => store.get('colorTemplates', []);
const saveTemplates = list => store.set('colorTemplates', list);
// A template without a typed name is shown as its colors: one small circle per distinct color, in the order of the part list.
const swatchDots = pick => [...new Map(ROLES.map(r => { const c = PALETTE[ROLE_FINISH[r]].find(x => x.id === (pick?.[r] ?? ROLE_DEFAULT[r])); return [c.hex, c]; })).values()]
  .map(c => `<i class="sw" style="background:${c.hex}" title="${esc(colorName(c))}"></i>`).join('');
const templateLabel = (tpl, name) => `<span class="dots">${swatchDots(tpl.choice)}</span>${name ? `<span>${esc(name)}</span>` : ''}`;   // no names: a template is just its colors
const snapshot = () => ({ choice: Object.fromEntries(ROLES.map(r => [r, colorOf(r).id])) });
const colorNames = pick => [...new Set(ROLES.map(r => colorName(PALETTE[ROLE_FINISH[r]].find(x => x.id === (pick?.[r] ?? ROLE_DEFAULT[r])))))].join(' · ');
const matchesTemplate = tpl => ROLES.every(r => (tpl.choice?.[r] ?? ROLE_DEFAULT[r]) === colorOf(r).id);
const loadTemplate = tpl => { colorUI.choice = { ...(tpl.choice ?? {}) }; };

// Accepts a colors.json from Download (role -> {color, hex}) or a template ({choice}); unknown roles and colors are skipped.
function importColors(text) {
  let data;
  try { data = JSON.parse(text); } catch { return 0; }
  const src = data?.choice ?? data;
  let n = 0;
  for (const r of ROLES) {
    const v = src?.[r];
    if (!v) continue;
    const id = typeof v === 'string' ? v : v.color, hex = typeof v === 'object' ? String(v.hex ?? '').toLowerCase() : '';
    const pal = PALETTE[ROLE_FINISH[r]];
    const c = pal.find(x => x.id === id) ?? (hex && pal.find(x => x.hex.toLowerCase() === hex));
    if (c) { colorUI.choice[r] = c.id; n++; }
  }
  return n;
}
$('#col-file').addEventListener('change', async e => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  const n = importColors(await file.text());
  if (n) { saveColors(); renderColors(); toast(t('colImportDone', n)); } else toast(t('colImportFail'));
});

function colorsExport() {

    }).join('')}</div>`) +

      `<button type="button" data-ccolor="${c.id}" aria-pressed="${c.id === colorOf(role).id}"><i class="sw" style="background:${c.hex}"></i>${esc(colorName(c))}<small>${c.hex}</small></button>`).join('')}</div>`, t(finish)) +

// Shared 3D studio for the Colors tab and the Builder preview: renderer, lights, soft floor shadow and orbit controls.
async function createStudio(stage, fov, isActive) {
  const THREE = await import('three');
  const { OrbitControls } = await import('three/addons/controls/OrbitControls.js');
  const { RoomEnvironment } = await import('three/addons/environments/RoomEnvironment.js');
  const { RoundedBoxGeometry } = await import('three/addons/geometries/RoundedBoxGeometry.js');
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  stage.prepend(renderer.domElement);
  const scene = new THREE.Scene();
  scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
  const camera = new THREE.PerspectiveCamera(fov, 1, 1, 20000);
  scene.add(camera);
  const sun = new THREE.DirectionalLight(0xffffff, 1.25);
  sun.position.set(40, 1200, 560);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -700, right: 700, top: 700, bottom: -300, near: 100, far: 2200 });
  sun.shadow.bias = -0.0006;
  sun.shadow.radius = 3;
  scene.add(sun);
  const fill = new THREE.DirectionalLight(0xffffff, 0.75);   // soft light from the left so side walls don't go dark
  fill.position.set(-700, 260, 380);
  scene.add(fill);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(6000, 3000), new THREE.ShadowMaterial({ opacity: 0.14 }));
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = -0.5;
  floor.receiveShadow = true;
  scene.add(floor);
  const group = new THREE.Group();
  scene.add(group);
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  const resize = () => {
    const { clientWidth: w, clientHeight: h } = stage;
    if (!w || !h) return;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  };
  new ResizeObserver(resize).observe(stage);
  renderer.setAnimationLoop(() => {
    if (!isActive()) return;
    controls.update();
    renderer.render(scene, camera);
  });
  return { THREE, RoundedBoxGeometry, scene, camera, controls, group, resize, renderer };
}
const colorEngine = () => (col.enginePromise ??= createStudio($('#col-stage'), 12, () => tab === 'colors').then(e => { col.engine = e; attachColorPicking(e); return e; }));

const colorMaterial = (THREE, finish, hex) => finish === 'basic'
  ? new THREE.MeshPhysicalMaterial({ color: hex, roughness: 0.38, clearcoat: 0.3, clearcoatRoughness: 0.35, envMapIntensity: 0.8 })
  : new THREE.MeshStandardMaterial({ color: hex, roughness: 0.95, metalness: 0, envMapIntensity: 0.85 });

/* --- Simplified drawers and sustainers built from plain shapes (no STL files needed). --- */
// The Colors tab shows a tower that follows the reference photo: S1F + S1F / L1F / L2F / sustainer L2F / (S1F over S1F) + S2F, with roof and handle.
// The Builder preview shows the unit you configured with the same shapes.
const STACK = { S: 164.8, L: 329.6, F1: 50, F2: 100, DEPTH: 190, LID: 22, FEET: 5 };
// Height of one box (nominal outer height plus the little joint between boxes).
const UNIT_H = { drawer: { '1F': 50, '2F': 100, '4F': 200 }, sustainer: { '1F': 64, '2F': 100, '4F': 200 } };
function stackUnits() {
  const { S, L, F1, F2 } = STACK;
  return [
    { kind: 'drawer', cx: -S / 2, w: S, y: 0, h: F1 }, { kind: 'drawer', cx: -S / 2, w: S, y: F1, h: F1 }, { kind: 'drawer', cx: S / 2, w: S, y: 0, h: F2 },
    { kind: 'sustainer', cx: 0, w: L, y: F2, h: F2 },
    { kind: 'drawer', cx: 0, w: L, y: 2 * F2, h: F2 },
    { kind: 'drawer', cx: 0, w: L, y: 3 * F2, h: F1 },
    { kind: 'drawer', cx: -S / 2, w: S, y: 3 * F2 + F1, h: F1 }, { kind: 'drawer', cx: S / 2, w: S, y: 3 * F2 + F1, h: F1 },
  ];
}
const STACK_TOP = 3 * STACK.F2 + 2 * STACK.F1;

function labelTexture(THREE, dark) {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 96;
  const x = c.getContext('2d');
  x.fillStyle = dark ? '#e2e2e2' : '#4b4b4b';
  x.font = '700 50px -apple-system, Helvetica, Arial, sans-serif';
  x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText('M6 PH 70', 128, 50);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 4;
  return tex;
}

// Helpers bound to one scene group; every colorable mesh carries its Colors-tab role so it can be recolored and picked.
function shapeKit(e) {
  const { THREE, RoundedBoxGeometry: RBG } = e;
  const g = new THREE.Group();
  const mats = {};
  const mat = role => mats[role] ??= colorMaterial(THREE, ROLE_FINISH[role], colorOf(role).hex);
  const fixed = (hex, rough = 0.7) => new THREE.MeshStandardMaterial({ color: hex, roughness: rough, envMapIntensity: 0.5 });
  const bolt = fixed('#1b1b1d', 0.5), slot = fixed('#e8e8e8', 0.6);
  const inkMat = (opacity) => new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity, depthWrite: false });
  const ink = inkMat(0.3), soft = inkMat(0.13);
  const rb = (w, h, d, r = 3) => new RBG(w, h, d, 4, Math.min(r, w / 2 - 0.05, h / 2 - 0.05, d / 2 - 0.05));
  const add = (geo, material, x, y, z, role) => {
    const m = new THREE.Mesh(geo, material);
    m.position.set(x, y, z);
    m.castShadow = m.receiveShadow = true;
    if (role) m.userData.role = role;
    g.add(m);
    return m;
  };
  // Flat marks printed on the front (seams, screw dimples, recesses): a see-through dark layer, so they work on every color.
  const decal = (geo, x, y, z, material = ink) => { const m = new THREE.Mesh(geo, material); m.position.set(x, y, z); g.add(m); return m; };
  const ring = (r, x, y, z = 7.7) => decal(new THREE.RingGeometry(r * 0.82, r, 32), x, y, z);
  const labelMat = new THREE.MeshBasicMaterial({ map: labelTexture(THREE, isDarkHex(colorOf('label').hex)), transparent: true, depthWrite: false });
  // The label is a small plate (about 40 x 14 mm) near the left edge of the facade.
  const label = (cx, w, y, h, ly, inset = 30) => {
    add(rb(40, 14, 1.6, 5), mat('label'), cx - w / 2 + inset, y + h / 2 + ly, 8.3, 'label');
    const text = new THREE.Mesh(new THREE.PlaneGeometry(33, 10), labelMat);
    text.position.set(cx - w / 2 + inset, y + h / 2 + ly, 9.3);
    g.add(text);
  };
  return { THREE, g, mats, labelMat, mat, fixed, bolt, slot, ink, soft, rb, add, decal, ring, label };
}

const roundedRect = (THREE, w, h, r) => {
  const s = new THREE.Shape();
  s.moveTo(-w / 2 + r, -h / 2); s.lineTo(w / 2 - r, -h / 2); s.absarc(w / 2 - r, -h / 2 + r, r, -Math.PI / 2, 0);
  s.lineTo(w / 2, h / 2 - r); s.absarc(w / 2 - r, h / 2 - r, r, 0, Math.PI / 2);
  s.lineTo(-w / 2 + r, h / 2); s.absarc(-w / 2 + r, h / 2 - r, r, Math.PI / 2, Math.PI);
  s.lineTo(-w / 2, -h / 2 + r); s.absarc(-w / 2 + r, -h / 2 + r, r, Math.PI, Math.PI * 1.5);
  return s;
};

// A drawer: rounded body, facade with a seam down the middle on 2F / 4F, the rotary key (centered; low on tall boxes),
// screw dimples, and the label at the left.
function addDrawer(k, { cx, w, y, h }, depth, lock = 'key') {
  const { THREE, add, mat, rb, label, decal, ring, bolt } = k;
  add(rb(w - 1.5, h - 1.5, depth, 7), mat('body'), cx, y + h / 2, -depth / 2, 'body');
  add(rb(w - 3, h - 3.5, 8, 6), mat('facade'), cx, y + h / 2, 3.5, 'facade');
  const tall = h > 70, ky = y + (h > 150 ? 0.16 * h : tall ? 0.27 * h : 0.5 * h), kx = cx;
  if (tall) {
    decal(new THREE.PlaneGeometry(0.9, h - 12), cx, y + h / 2, 7.7);          // facade seam
    ring(3.4, cx, ky + 27);                                                    // lock mark on the seam
    ring(5.2, cx - w / 2 + 30, y + h - 25); ring(5.2, cx + w / 2 - 30, y + h - 25);
  }
  for (const dx of [27, 52]) if (kx + dx < cx + w / 2 - 14) ring(5.2, kx + dx, ky);
  if (lock === 'hidden') {   // hidden key: just a small round cover on the facade
    add(new THREE.CylinderGeometry(6, 6, 3, 28), mat('key'), kx, ky, 9, 'key').rotation.x = Math.PI / 2;
  } else {
    add(new THREE.CylinderGeometry(18, 18, 8, 48), mat('key'), kx, ky, 11.5, 'key').rotation.x = Math.PI / 2;
    add(rb(41, 12, 8, 4.5), mat('keycap'), kx, ky, 19.5, 'keycap');           // the lever lies across the knob
    const dot = add(new THREE.CylinderGeometry(2.2, 2.2, 1, 20), bolt, kx + 14, ky, 23.7); dot.rotation.x = Math.PI / 2;
  }
  label(cx, w, y, h, ky - (y + h / 2));
}

// A sustainer: body, lid, facade, latches (in a recessed pocket) and columns of bolts at both ends.
function addSustainer(k, { cx, w, y, h }, depth, locks = 2) {
  const { THREE, add, mat, rb, label, bolt, slot, decal, soft } = k;
  const { LID } = STACK;
  add(rb(w - 1.5, h - LID - 1, depth, 7), mat('body'), cx, y + (h - LID - 1) / 2, -depth / 2, 'body');
  add(rb(w, LID, depth + 2, 8), mat('roof'), cx, y + h - LID / 2, -depth / 2 + 1, 'roof');
  add(rb(w - 3, h - LID - 3.5, 8, 6), mat('facade'), cx, y + (h - LID - 1) / 2, 3.5, 'facade');
  const n = Math.max(0, Math.min(locks, Math.floor(w / 70))), lh = h < 80 ? h - 8 : h > 150 ? 88 : 62;
  for (let i = 0; i < n; i++) {
    const lx = cx + ((i + 0.5) / n - 0.5) * w, ly = y + h - lh / 2 - 2;
    decal(new THREE.PlaneGeometry(58, 20), lx, ly - lh / 2 - 7, 7.7, soft);   // the recess under the latch
    add(rb(54, lh, 10, 5), mat('lock'), lx, ly, 9, 'lock');
    add(rb(26, 5, 3, 2), slot, lx, ly, 14.5);
  }
  const rows = h > 150 ? [10, (h - LID) / 2, h - LID - 8] : [10, h - LID - 8];
  for (const sx of [-1, 1]) for (const yy of rows) add(new THREE.CylinderGeometry(4.5, 4.5, 2, 20), bolt, cx + sx * (w / 2 - 9), y + yy, 8).rotation.x = Math.PI / 2;
  label(cx, w, y, h, h < 80 ? 0.1 * h : h > 150 ? -0.3 * h : -0.2 * h, 36);
}

// Runner stoppers lock the drawer on its rail: flat pill-shaped plates flush with the box's left side wall, about a third of the way
// back from the front, one per 1F, two per 2F and four per 4F. Only the left wall of the stack is visible, so only boxes on that edge get them.
function addStoppers(k, { y, h, kind }, depth, wallX) {
  const { THREE } = k;
  const fractions = h < 80 ? [0.5] : h > 150 ? [0.87, 0.62, 0.38, 0.13] : kind === 'sustainer' ? [0.7, 0.3] : [0.74, 0.3];
  const geo = new THREE.ExtrudeGeometry(roundedRect(THREE, 18, 8, 4), { depth: 0.9, bevelEnabled: false, curveSegments: 12 });
  geo.translate(0, 0, -0.45);
  geo.rotateY(Math.PI / 2);
  for (const f of fractions) k.add(geo, k.mat('stopper'), wallX, y + h * f, -0.28 * depth, 'stopper');
}

// Roof styles of the top unit: grid, bowl, table and under-table mount.
function addRoof(k, style, w, depth, y) {
  const { THREE, add, mat, rb } = k;
  const rw = w + 2;
  add(rb(rw, 8, depth + 4, 4), mat('roof'), 0, y + 4, -depth / 2, 'roof');
  if (style === 'grid') {
    const nx = Math.max(2, Math.round(rw / 42)), nz = Math.max(2, Math.round(depth / 42));
    for (let i = 0; i <= nx; i++) add(new THREE.BoxGeometry(2.6, 5, depth + 2), mat('roof'), -rw / 2 + 4 + i * ((rw - 8) / nx), y + 9, -depth / 2, 'roof');
    for (let i = 0; i <= nz; i++) add(new THREE.BoxGeometry(rw - 2, 5, 2.6), mat('roof'), 0, y + 9, -depth + 4 + i * ((depth - 8) / nz), 'roof');
  } else if (style === 'bowl') {   // a shallow tray: raised rim all round
    add(new THREE.BoxGeometry(rw, 7, 3), mat('roof'), 0, y + 11, -depth - 0.5, 'roof');
    add(new THREE.BoxGeometry(rw, 7, 3), mat('roof'), 0, y + 11, 1.5, 'roof');
    for (const sx of [-1, 1]) add(new THREE.BoxGeometry(3, 7, depth + 4), mat('roof'), sx * (rw / 2 - 1.5), y + 11, -depth / 2, 'roof');
  } else if (style === 'mount') {   // under-table mount: four flanges to screw the unit to a desk
    for (const sx of [-1, 1]) for (const sz of [-1, 1]) add(rb(24, 4, 26, 2), mat('roof'), sx * (rw / 2 + 10), y + 2, -depth / 2 + sz * (depth / 2 - 4), 'roof');
  }
}

// The top handle: about 126 mm wide, with a flange that sits on the roof.
function addHandle(k, base, depth) {
  const { THREE, add, mat } = k;
  const shape = roundedRect(THREE, 126, 44, 12);
  shape.holes.push(new THREE.Path(roundedRect(THREE, 88, 17, 8).getPoints(24)));
  const hg = new THREE.ExtrudeGeometry(shape, { depth: 30, bevelEnabled: true, bevelSize: 2, bevelThickness: 2, bevelSegments: 3, curveSegments: 16 });
  hg.translate(0, 0, -15);
  add(hg, mat('handle'), 0, base + 24, -depth * 0.45, 'handle');
}

// Two small feet under the bottom of the stack; the whole group is lifted by their height.
function addFeet(k, w, depth) {
  for (const sx of [-1, 1]) k.add(k.rb(26, STACK.FEET, 46, 2), k.mat('body'), sx * (w / 2 - 30), STACK.FEET / 2 - 0.01, -depth / 2, 'body');
  k.g.position.y = STACK.FEET;
}

// The Colors tab tower.
function buildTower(e) {
  const k = shapeKit(e);
  const { L, DEPTH } = STACK;
  for (const u of stackUnits()) {
    if (u.cx - u.w / 2 === -L / 2) addStoppers(k, u, DEPTH, -L / 2 + 0.75);
    if (u.kind === 'drawer') addDrawer(k, u, DEPTH); else addSustainer(k, u, DEPTH, 2);
  }
  addRoof(k, 'grid', L, DEPTH, STACK_TOP);
  addHandle(k, STACK_TOP + 8, DEPTH);
  addFeet(k, L, DEPTH);
  return { group: k.g, mats: k.mats, labelMat: k.labelMat };
}

// The Builder preview: the configured unit (size, shape, lock, roof, handle), stacked `count` high.
function buildPreviewUnit(e, st) {
  const k = shapeKit(e);
  const w = SPEC.width[st.w], depth = SPEC.length(st.d), drawer = st.type === 'drawer';
  const pitch = UNIT_H[st.type][st.h];
  const n = Math.max(1, Math.min(st.count | 0, 6));
  for (let i = 0; i < n; i++) {
    const u = { kind: st.type, cx: 0, w, y: i * pitch, h: pitch };
    if (drawer) addDrawer(k, u, depth, st.lock); else addSustainer(k, u, depth, st.locks);
    addStoppers(k, u, depth, -w / 2 + 0.75);
  }
  let base = n * pitch;
  if (drawer) {
    const style = /Under/i.test(st.roof) ? 'mount' : /Grid/i.test(st.roof) ? 'grid' : /Bowl/i.test(st.roof) ? 'bowl' : /Table/i.test(st.roof) ? 'table' : '';
    if (style) { addRoof(k, style, w, depth, base); base += 8; }
    if (st.handle) addHandle(k, base, depth);
  }
  addFeet(k, w, depth);
  return k;
}

const bp = { enginePromise: null, engine: null, kit: null, token: 0 };
const bpEngine = () => (bp.enginePromise ??= createStudio($('#bp-stage'), 14, () => tab === 'build').then(e => {
  e.controls.enableZoom = e.controls.enablePan = false;
  e.renderer.domElement.style.touchAction = 'pan-y';   // one-finger vertical swipes still scroll the page
  return (bp.engine = e);
}));
function disposeGroup(g) {
  g.traverse(o => { o.geometry?.dispose(); if (o.material) [].concat(o.material).forEach(m => { m.map?.dispose(); m.dispose(); }); });
}
async function renderPreview() {
  const token = ++bp.token;
  let e;
  try { e = await bpEngine(); } catch { $('#bp').hidden = true; return; }
  if (token !== bp.token) return;
  for (const g of [...e.group.children]) { disposeGroup(g); e.group.remove(g); }
  bp.kit = buildPreviewUnit(e, state);
  e.group.add(bp.kit.g);
  e.resize();
  const { THREE } = e;
  const box = new THREE.Box3().setFromObject(e.group);
  const size = box.getSize(new THREE.Vector3()), center = box.getCenter(new THREE.Vector3());
  const vfov = THREE.MathUtils.degToRad(e.camera.fov), hfov = 2 * Math.atan(Math.tan(vfov / 2) * e.camera.aspect);
  const dist = Math.max((size.y / 2) / Math.tan(vfov / 2), (size.x / 2) / Math.tan(hfov / 2)) * 1.32 + size.z / 2;
  e.controls.target.copy(center);
  e.camera.position.copy(center).add(new THREE.Vector3(-0.3, 0.2, 1).normalize().multiplyScalar(dist));
  e.camera.near = dist / 100; e.camera.far = dist * 20; e.camera.updateProjectionMatrix();
  e.controls.update();
}

// Builds the tower once; after that a color change only recolors it.
async function buildColors() {
  if (col.tower) { colorApply(); return; }
  let e;
  try { e = await colorEngine(); } catch { colorMessage(`<h3>${esc(t('colNo3d'))}</h3>`); return; }
  if (col.tower) { colorApply(); return; }
  const { THREE } = e;
  col.tower = buildTower(e);
  e.group.add(col.tower.group);
  colorApply();
  e.resize();
  const box = new THREE.Box3().setFromObject(e.group);
  const size = box.getSize(new THREE.Vector3()), center = box.getCenter(new THREE.Vector3());
  const vfov = THREE.MathUtils.degToRad(e.camera.fov), hfov = 2 * Math.atan(Math.tan(vfov / 2) * e.camera.aspect);
  // Front-on, turned slightly to the left so the left side wall (with the runner stoppers) shows.
  const dist = Math.max((size.y / 2) / Math.tan(vfov / 2), (size.x / 2) / Math.tan(hfov / 2)) * 1.12 + size.z / 2;
  e.controls.target.copy(center).add(new THREE.Vector3(0, 6, 0));
  e.camera.position.copy(e.controls.target).add(new THREE.Vector3(-0.3, 0.2, 1).normalize().multiplyScalar(dist));
  e.camera.near = dist / 100; e.camera.far = dist * 20; e.camera.updateProjectionMatrix();
  col.home = e.camera.position.clone();
  e.controls.update();
}

// Cheap update when only the picks change: recolor the materials.
function colorApply() {
  const e = col.engine, tower = col.tower;
  if (!e || !tower) return;
  for (const [role, m] of Object.entries(tower.mats)) m.color.set(colorOf(role).hex);
  const dark = isDarkHex(colorOf('label').hex);
  if (tower.dark !== dark) { tower.labelMat.map.dispose(); tower.labelMat.map = labelTexture(e.THREE, dark); tower.labelMat.needsUpdate = true; tower.dark = dark; }
}

// Click a part to select its role; hover shows its name.
function attachColorPicking(e) {
  const { THREE } = e, canvas = e.renderer.domElement, ray = new THREE.Raycaster(), pt = new THREE.Vector2();
  const tip = Object.assign(document.createElement('div'), { className: 'col-tip', hidden: true });
  $('#col-stage').append(tip);
  const pick = ev => {
    const r = canvas.getBoundingClientRect();
    pt.set((ev.clientX - r.left) / r.width * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(pt, e.camera);
    return ray.intersectObjects(e.group.children, true).find(h => h.object.userData.role)?.object.userData.role ?? null;
  };
  let down = null;
  canvas.addEventListener('pointerdown', ev => { down = [ev.clientX, ev.clientY]; });
  canvas.addEventListener('pointerup', ev => {
    if (!down || Math.hypot(ev.clientX - down[0], ev.clientY - down[1]) > 5) return;
    const role = pick(ev);
    if (role && colorUI.role !== role) { colorUI.role = role; saveColors(); renderColors(); }
  });
  canvas.addEventListener('pointermove', ev => {
    const role = ev.buttons ? null : pick(ev);
    tip.hidden = !role;
    canvas.style.cursor = role ? 'pointer' : '';
    if (role) {
      const r = canvas.getBoundingClientRect();
      tip.textContent = `${t('role_' + role)} · ${t(ROLE_FINISH[role])} · ${colorName(colorOf(role))}`;
      tip.style.transform = `translate(${ev.clientX - r.left + 14}px, ${ev.clientY - r.top + 14}px)`;
    }
  });
  canvas.addEventListener('pointerleave', () => { tip.hidden = true; });
}

$('#view-colors').addEventListener('click', async e => {
  const b = e.target.closest('button');
  if (!b) return;
  const role = colorUI.role;
  if (b.dataset.crole) colorUI.role = b.dataset.crole;
  else if (b.dataset.ccolor) colorUI.choice[role] = b.dataset.ccolor;
  else if (b.dataset.ctpl) {
    const tpl = b.dataset.ctpl === 'default' ? { name: t('colTplDefault'), choice: {} } : templates()[Number(b.dataset.ctpl)];
    if (!tpl) return;
    loadTemplate(tpl);
    toast(t('colTplLoaded', colorNames(tpl.choice)));
  }
  else if (b.dataset.ctplDel) {
    const list = templates();
    list.splice(Number(b.dataset.ctplDel), 1);
    saveTemplates(list);
  }
  else if (b.dataset.cact === 'save') {
    const list = templates();
    if (list.some(matchesTemplate)) { toast(t('colTplExists')); return; }   // that exact combination is already saved
    list.push(snapshot());
    saveTemplates(list);
    toast(t('colTplSavedPlain'));
  }
  else if (b.id === 'col-clear') colorUI.choice = {};
  else if (b.dataset.cact === 'all') { const c = colorOf(role).id; ROLES.filter(r => ROLE_FINISH[r] === 'matte').forEach(r => { colorUI.choice[r] = c; }); }
  else if (b.dataset.cact === 'import') { $('#col-file').click(); return; }
  else if (b.dataset.cact === 'download') {
    const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(new Blob([JSON.stringify(colorsExport(), null, 2)], { type: 'application/json' })), download: 'colors.json' });
    a.click(); URL.revokeObjectURL(a.href); return;
  }
  else if (b.id === 'col-shuffle') { for (const r of ROLES) { const pal = PALETTE[ROLE_FINISH[r]]; colorUI.choice[r] = pal[Math.floor(Math.random() * pal.length)].id; } }
  else if (b.id === 'col-reset') { if (col.engine && col.home) { col.engine.camera.position.copy(col.home); col.engine.controls.update(); } return; }
  else return;
  saveColors();
  renderColors();
});

function renderAll() {
  renderChrome();
  renderBuilder();
  renderScope();
  if (tab === 'files') renderFiles();
  if (tab === 'manuals') renderManuals();
  if (tab === 'colors') renderColors();
}
renderAll();
showTab(tab);
</script>
</body>
</html>
