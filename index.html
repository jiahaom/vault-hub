<style>
:root {
  --bg: #0d0e10;
  --panel: #15171a;
  --panel-2: #1b1e22;
  --hover: #22262b;
  --line: #2a2e34;
  --line-strong: #3a3f47;
  --text: #ecedef;
  --muted: #a0a5ad;
  --faint: #6c727b;
  --accent: #ff7a3d;
  --accent-ink: #1a0d06;
  --accent-soft: rgba(255, 122, 61, .13);
  --ok: #3ccf8e;
  --ok-soft: rgba(60, 207, 142, .12);
  --warn: #f2b84b;
  --warn-soft: rgba(242, 184, 75, .12);
  --model: #d9dce1;
  --grid: #8a9099;
  --shadow: 0 24px 60px rgba(0, 0, 0, .5);
  --radius: 12px;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f3f3f1;
    --panel: #ffffff;
    --panel-2: #f7f7f5;
    --hover: #efefec;
    --line: #e4e4e0;
    --line-strong: #d0d0cb;
    --text: #18191b;
    --muted: #5d6168;
    --faint: #8d9198;
    --accent: #e8622a;
    --accent-ink: #ffffff;
    --accent-soft: rgba(232, 98, 42, .1);
    --ok: #1f9d68;
    --ok-soft: rgba(31, 157, 104, .1);
    --warn: #b7791f;
    --warn-soft: rgba(183, 121, 31, .1);
    --model: #c9ccd2;
    --grid: #9aa0a8;
    --shadow: 0 24px 60px rgba(20, 20, 30, .18);
    color-scheme: light;
  }
}
:root[data-theme="dark"] { color-scheme: dark; }

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
svg { display: block; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

/* ---------- Header ---------- */
.top {
  position: sticky; top: 0; z-index: 20;
  background: color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter: saturate(1.4) blur(12px);
  -webkit-backdrop-filter: saturate(1.4) blur(12px);
  border-bottom: 1px solid var(--line);
}
.top-inner {
  max-width: 1320px; margin: 0 auto; padding: 0 24px;
  display: flex; align-items: center; gap: 24px; height: 60px;
}
.brand { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
.brand-mark {
  width: 28px; height: 28px; border-radius: 8px; background: var(--accent);
  display: grid; place-items: center; color: var(--accent-ink);
}
.brand-name { font-weight: 700; letter-spacing: .04em; }
.brand-sub { color: var(--faint); font-size: 13px; }
.tabs { display: flex; gap: 2px; height: 100%; }
.tab {
  background: none; border: 0; padding: 0 14px; height: 100%;
  color: var(--muted); font-weight: 550; position: relative;
}
.tab:hover { color: var(--text); }
.tab[aria-selected="true"] { color: var(--text); }
.tab[aria-selected="true"]::after {
  content: ""; position: absolute; left: 12px; right: 12px; bottom: -1px; height: 2px;
  background: var(--accent); border-radius: 2px;
}
.top-actions { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.pill {
  display: inline-flex; align-items: center; gap: 7px;
  font-size: 12px; color: var(--muted); padding: 5px 10px;
  border: 1px solid var(--line); border-radius: 999px; white-space: nowrap; background: none;
}
.pill i { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
.pill.live i { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); }
.pill.static i { background: var(--warn); }
.btn {
  display: inline-flex; align-items: center; gap: 7px;
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
  padding: 7px 12px; font-size: 13px; font-weight: 550; text-decoration: none; white-space: nowrap;
  transition: border-color .15s, background .15s;
}
.btn:hover { border-color: var(--line-strong); background: var(--hover); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn svg { width: 15px; height: 15px; }

main { max-width: 1320px; margin: 0 auto; padding: 24px; }
.view[hidden] { display: none !important; }

/* ---------- Builder ---------- */
.bcol { position: sticky; top: 84px; display: flex; flex-direction: column; gap: 14px; max-height: calc(100vh - 108px); overflow: auto; }
.bcol .config { position: static; max-height: none; overflow: visible; }
.bp { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; flex: none; }
.bp { position: relative; }
.bp-flip { position: absolute; top: 8px; right: 8px; z-index: 2; width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line); background: rgba(255, 255, 255, .85); color: #18191b; font-size: 16px; line-height: 1; }
.bp-flip:hover { background: #fff; }
.bp-stage { position: relative; height: 250px; background: radial-gradient(ellipse at 50% 25%, #eceded, #bfc2c7); }
.bp-stage canvas { position: absolute; inset: 0; width: 100% !important; height: 100% !important; }
.builder { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 24px; align-items: start; }
.config {
  position: sticky; top: 84px;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 20px; display: flex; flex-direction: column; gap: 18px;
  max-height: calc(100vh - 108px); overflow: auto;
}
.field > .lbl {
  display: flex; justify-content: space-between; align-items: baseline;
  font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 8px;
  text-transform: uppercase; letter-spacing: .06em;
}
.field > .lbl small { text-transform: none; letter-spacing: 0; font-weight: 450; color: var(--faint); }
.seg {
  display: flex; background: var(--panel-2); border: 1px solid var(--line);
  border-radius: 9px; padding: 3px; gap: 3px;
}
.seg button {
  flex: 1; border: 0; background: none; border-radius: 6px; padding: 7px 4px;
  font-weight: 600; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 1px;
  transition: background .15s, color .15s;
}
.seg button small { font-size: 10.5px; font-weight: 500; color: var(--faint); }
.seg button:hover:not(:disabled) { color: var(--text); }
.seg button[aria-pressed="true"] { background: var(--hover); color: var(--text); box-shadow: inset 0 0 0 1px var(--line-strong); }
.seg button[aria-pressed="true"] small { color: var(--muted); }
.seg button:disabled { opacity: .3; cursor: not-allowed; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  border: 1px solid var(--line); background: none; border-radius: 999px;
  padding: 5px 11px; font-size: 13px; color: var(--muted);
}
.chip:hover { color: var(--text); border-color: var(--line-strong); }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 55%, transparent); color: var(--text); }
.row-inline { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.row-inline .lbl { margin: 0; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); }
.stepper button { border: 0; background: none; width: 32px; height: 30px; font-size: 16px; color: var(--muted); }
.stepper button:hover { color: var(--text); }
.stepper output { min-width: 28px; text-align: center; font-weight: 650; font-variant-numeric: tabular-nums; }
.switch { position: relative; width: 36px; height: 20px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--line-strong); transition: background .15s; pointer-events: none; }
.switch span::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { transform: translateX(16px); }
.switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.divider { height: 1px; background: var(--line); margin: 2px 0; }
.ref {
  display: block; width: 100%; border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
  background: #9aa0a8; padding: 0; position: relative;
}
.ref img { width: 100%; display: block; aspect-ratio: 2.4; object-fit: cover; }
.ref span {
  position: absolute; left: 8px; bottom: 8px; font-size: 11.5px; font-weight: 600;
  background: rgba(0, 0, 0, .62); color: #fff; padding: 3px 8px; border-radius: 6px;
}

.results { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
/* ---------- Hero: a drafting-sheet title block ----------
   Order: configure (type × quantity, material and print totals, Gather) → size pickers → measured result.
   Mono numerals, one accent mark on the headline measurement, a faint drafting grid fading in from the corner. */
.summary {
  container: hero / inline-size; position: relative; isolation: isolate; overflow: hidden;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 22px 24px 24px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 20px 24px; align-items: start;
}
.summary::before {
  content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none; opacity: .5;
  background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: 28px 28px; background-position: -1px -1px;
  -webkit-mask-image: radial-gradient(ellipse 70% 90% at 100% 0%, #000 0%, transparent 70%); mask-image: radial-gradient(ellipse 70% 90% at 100% 0%, #000 0%, transparent 70%);
}
.hero-main { min-width: 0; display: flex; flex-direction: column; gap: 12px; }
.hero-ctl { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.hero-ctl .seg, .hero-ctl .qty { height: 42px; box-sizing: border-box; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; }
.hero-ctl .seg { width: auto; padding: 3px; gap: 3px; }
.hero-ctl .seg button { flex: none; flex-direction: row; gap: 8px; padding: 0 16px 0 13px; justify-content: center; font-size: 13.5px; border-radius: 7px; }
.hero-ctl .seg button svg { width: 17px; height: 17px; flex: none; opacity: .75; }
.hero-ctl .seg button[aria-pressed="true"] { background: var(--text); color: var(--bg); box-shadow: none; }
.hero-ctl .seg button[aria-pressed="true"] svg { opacity: 1; }
/* Quantity: the same pill as the type switch, with its caption inside instead of a dangling ×. */
.hero-ctl .qty { display: inline-flex; align-items: center; gap: 10px; padding: 3px 3px 3px 14px; }
.qty-lbl { display: inline-flex; align-items: baseline; gap: 4px; font-size: 11px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
.qty-lbl b { font-weight: 650; }
.qty-lbl i { display: none; font-style: normal; font-size: 14px; letter-spacing: 0; }
.hero-ctl .stepper { height: 34px; border: 0; background: none; border-radius: 7px; gap: 2px; }
.hero-ctl .stepper button { width: 34px; height: 34px; border-radius: 7px; font-size: 17px; color: var(--muted); }
.hero-ctl .stepper button:hover:not(:disabled) { background: var(--hover); color: var(--text); }
.hero-ctl .stepper button:disabled { opacity: .3; cursor: not-allowed; }
.hero-ctl .stepper output { font-family: var(--mono); font-size: 15px; font-weight: 600; min-width: 36px; }

.facts { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; color: var(--muted); font-size: 12.5px; }
.fil { display: inline-flex; align-items: center; gap: 7px; height: 26px; padding: 0 10px 0 8px; border: 1px solid var(--line-strong); border-radius: 999px; font-size: 12px; font-weight: 600; color: var(--text); background: var(--panel); white-space: nowrap; }
.fil.any { padding-left: 10px; color: var(--muted); font-weight: 550; }
.fil.tpu { border-style: dashed; }
.fil .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 1px rgba(128, 128, 128, .5); }
.fil b { font-family: var(--mono); font-weight: 600; font-size: 11.5px; color: var(--faint); }
.facts .print { display: inline-flex; align-items: center; gap: 12px; font-family: var(--mono); font-size: 12.5px; font-variant-numeric: tabular-nums; color: var(--text); white-space: nowrap; margin-left: 4px; }
.facts .print span { display: inline-flex; align-items: center; gap: 5px; }
.facts .print svg { width: 14px; height: 14px; color: var(--faint); flex: none; }
.facts .print em { font-style: normal; color: var(--faint); font-size: 11.5px; }
.summary .acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.summary .acts .btn { height: 40px; padding: 0 16px; }

/* Size pickers: W × L × H, selected = accent ring. All controls share one height. */
.unit-pick {
  grid-column: 1 / -1; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 16px;
  padding-top: 20px; border-top: 1px solid var(--line); --pick-h: 58px;
}
.pick { min-width: 0; grid-column: span 6; }
.pick > .lbl { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 11px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.pick > .lbl small { font-size: 11px; font-weight: 450; letter-spacing: 0; text-transform: none; color: var(--faint); }
.unit-pick .seg { height: var(--pick-h); box-sizing: border-box; background: var(--panel-2); }
.unit-pick .seg button { justify-content: center; font-size: 14px; }
.unit-pick .seg button small { font-family: var(--mono); font-size: 10.5px; }
.unit-pick .seg button[aria-pressed="true"] { background: var(--accent-soft); box-shadow: inset 0 0 0 1.5px var(--accent); color: var(--text); }
.unit-pick .seg button[aria-pressed="true"] small { color: var(--accent); }

/* Measured result: Outer is the headline figure. */
.specs { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 10px; background: color-mix(in srgb, var(--panel-2) 70%, transparent); overflow: hidden; }
.spec { padding: 14px 16px 13px; display: flex; flex-direction: column; gap: 3px; min-width: 0; box-shadow: 0 0 0 .5px var(--line); }
.spec:first-child { grid-column: span 2; box-shadow: 0 0 0 .5px var(--line), inset 3px 0 0 var(--accent); padding-left: 18px; }
.spec span { font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); }
.spec b { font-family: var(--mono); font-size: 17px; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; white-space: nowrap; animation: spec-in .22s ease both; }
.spec:first-child b { font-size: 23px; }
.spec b i { font-style: normal; font-weight: 450; font-size: 12px; letter-spacing: 0; color: var(--muted); margin-left: 7px; }
.spec small { font-size: 11.5px; color: var(--faint); }
@keyframes spec-in { from { opacity: 0; transform: translateY(4px); } }
@container hero (min-width: 760px) {
  .specs { grid-template-columns: 1.5fr 1.25fr 1fr; }
  .spec:first-child { grid-column: auto; }
}
@container hero (min-width: 540px) {
  .unit-pick { grid-template-columns: repeat(12, minmax(0, 1fr)); }
  .pick.p-w { grid-column: span 4; }
  .pick.p-d { grid-column: span 5; }
  .pick.p-h { grid-column: span 3; }
}
@container hero (max-width: 539px) {
  .summary { grid-template-columns: 1fr; padding: 18px 18px 20px; }
  .hero-ctl { flex-wrap: nowrap; gap: 8px; }
  .hero-ctl .seg { flex: 1; min-width: 0; }
  .hero-ctl .seg button { flex: 1; padding: 0 6px; }
  .hero-ctl .seg button svg { display: none; }
  .hero-ctl .qty { padding-left: 10px; gap: 4px; }
  .qty-lbl b { display: none; }
  .qty-lbl i { display: inline; }
  .summary .acts { justify-content: stretch; }
  .summary .acts .btn { flex: 1; justify-content: center; }
}

.section { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.section-hd { display: flex; align-items: baseline; gap: 10px; padding: 13px 18px 11px; border-bottom: 1px solid var(--line); }
.section-hd h2 { margin: 0; font-size: 13px; font-weight: 650; letter-spacing: .02em; }
.section-hd span { font-size: 12px; color: var(--faint); }
.list { list-style: none; margin: 0; padding: 0; }

.row {
  display: grid; grid-template-columns: 26px 44px minmax(0, 1fr) auto 48px 64px auto;
  align-items: center; gap: 12px; padding: 9px 12px 9px 18px; border-top: 1px solid var(--line);
  transition: background .12s;
}
.list > .row:first-child { border-top: 0; }
.row:hover { background: var(--panel-2); }
.ck { position: relative; width: 18px; height: 18px; }
.ck input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.ck span {
  position: absolute; inset: 0; border: 1.5px solid var(--line-strong); border-radius: 5px; pointer-events: none;
  display: grid; place-items: center; transition: background .12s, border-color .12s;
}
.ck input:checked + span { background: var(--ok); border-color: var(--ok); }
.ck input:checked + span::after { content: ""; width: 9px; height: 5px; border: 2px solid #fff; border-top: 0; border-right: 0; transform: translateY(-1px) rotate(-45deg); }
.ck input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.meta { min-width: 0; display: flex; flex-direction: column; gap: 1px; background: none; border: 0; padding: 0; text-align: left; }
.meta .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meta .pt { font-family: var(--mono); font-size: 11px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
button.meta:hover .nm { color: var(--accent); }
.row.off { opacity: .48; }
.row.off .thumb img { filter: grayscale(1); }
.row.off .qty { text-decoration: line-through; }
.switch.inc { align-self: center; margin: 0 4px 0 0; width: 32px; height: 18px; }
.switch.inc span::after { width: 14px; height: 14px; }
.switch.inc input:checked + span::after { transform: translateX(14px); }
.row.done .nm { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--faint); }
.badges { display: flex; gap: 5px; justify-content: flex-end; flex-wrap: wrap; }
.badge { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 999px; white-space: nowrap; border: 1px solid transparent; }
.badge.sup { background: var(--warn-soft); color: var(--warn); }
.badge.pcs { background: var(--accent-soft); color: var(--accent); }
.badge.muted { border-color: var(--line); color: var(--faint); }
.badge.mat { display: inline-flex; align-items: center; gap: 5px; }
.badge.mat.matte { background: var(--text); color: var(--bg); }
.badge.mat.basic { border-color: var(--line-strong); color: var(--muted); }
.badge.mat.tpu { border: 1px dashed var(--line-strong); color: var(--muted); }
.badge.mat.mat-sm { display: none; align-self: flex-start; margin-top: 3px; }
.qty { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
.qty.na { color: var(--faint); font-weight: 500; font-size: 12px; }
.sz { font-size: 12px; color: var(--faint); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.acts-row { display: flex; gap: 2px; min-width: 66px; justify-content: flex-end; }
.ib {
  width: 32px; height: 32px; display: grid; place-items: center; border-radius: 8px;
  border: 0; background: none; color: var(--muted); text-decoration: none;
}
.ib:hover { background: var(--hover); color: var(--text); }
.ib svg { width: 17px; height: 17px; }
.row.missing .nm { color: var(--warn); }
.thumb {
  width: 44px; height: 44px; border-radius: 8px; overflow: hidden; flex: none;
  background: var(--panel-2); border: 1px solid var(--line); display: grid; place-items: center; color: var(--faint);
  padding: 0;
}
.thumb img { width: 100%; height: 100%; object-fit: contain; }
.thumb svg { width: 18px; height: 18px; }
button.thumb:hover { border-color: var(--line-strong); }
.opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 8px; }
.opt {
  border: 1px solid var(--line); background: var(--panel-2); border-radius: 10px; padding: 6px 6px 8px;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  font-size: 12px; font-weight: 600; color: var(--muted); line-height: 1.25; text-align: center;
  transition: border-color .15s, background .15s;
}
.opt:hover { border-color: var(--line-strong); color: var(--text); }

const D_FAM = w => `^01\\. DRAWERS/\\d\\d\\. ${w} Families/`;

function normalizeState() {
  if (!WIDTHS.includes(state.w)) state.w = 'S';
  state.d = Number(state.d);
  if (!HEIGHTS.some(h => available(state.w, state.d, h))) state.d = DEPTHS.find(d => HEIGHTS.some(h => available(state.w, d, h))) ?? 3;
  if (!available(state.w, state.d, state.h)) state.h = HEIGHTS.find(h => available(state.w, state.d, h)) ?? '1F';
  if (!['full', 'low', 'mid'].includes(state.gdh) || (state.gdh === 'mid' && state.h === '1F')) state.gdh = 'full';
  if (!['whole', 'split'].includes(state.baseCut)) state.baseCut = 'whole';
  if (!['sized', 'universal'].includes(state.kit)) state.kit = 'sized';
  state.count = Math.min(99, Math.max(1, state.count | 0));
  state.locks = Math.min(4, Math.max(0, state.locks | 0));
  if (state.type === 'drawer') {
    if (!drawerRoofs().some(r => r.id === state.roof)) state.roof = '';
    if (!drawerBaseplates().some(b => b.id === state.base)) state.base = '';
  } else {
    const variants = sustainerVariants();
    if (!variants.some(v => v.id === state.variant)) state.variant = variants[0]?.id ?? '';
    const lids = sustainerLids();
    if (!lids.some(l => l.id === state.lid)) state.lid = lids[0]?.id ?? 'whole';
  }
}

// "Part 1 / Part 2" files belong to one choice; duplicates of a single-piece choice keep the first file.
function choice(id, label, files) {
  const parts = files.filter(f => /Part \d/i.test(f.name));
  return { id, label, files: parts.length ? parts : files.slice(0, 1) };
}

  return [...m].map(([k, fs]) => choice(k, labelOf(k), fs));
}

    f => f.name.replace(new RegExp(`^${w}${d} `, 'i'), '').replace(/\.stl$/i, ''),

}

}

  ];
  const lock = state.lock === 'hidden'
    ? [part(first(`${D_UNI}Hidden Key \\(`), 1, { expect: 'Hidden Key' }), part(first(`${D_UNI}Hidden Key Part 2`), 1, { expect: 'Hidden Key Part 2' })]
    : [part(first(`${D_UNI}Key \\(`), 1, { expect: 'Key' })];
  lock.push(part(first(`${D_UNI}Key Cap\\.stl$`), 1, { expect: 'Key Cap' }));
  const roof = drawerRoofs().find(r => r.id === state.roof);
  const roofItems = roof ? roof.files.map(f => part(f, 1, { once: true })) : [];
  if (roof && /Heawyweight/i.test(roof.id)) roofItems.push(...[first(`${D_UNI}Heawyweight Roof Handle`), first(`${D_UNI}Heawyweight Roof Insert`)].filter(Boolean).map(f => part(f, 1, { once: true })));
  const handle = state.handle ? [part(first(`${D_UNI}Top Handle`), 1, { once: true, expect: 'Top Handle' })] : [];
  const plate = drawerBaseplates().find(b => b.id === state.base);
  const bolts = h === '1F' ? 4 : 6;
  return [
    sec(t('secUnit'), unit, { sub: `${w}${d} · ${h}` }),
    sec(t('secMech'), mech),
    sec(t('lock'), lock),
    sec(t('roof'), roofItems, { sub: t('secTopNote') }),
    sec(t('handle'), handle, { sub: t('secTopNote') }),
    sec(t('baseplate'), plate ? plate.files.map(f => part(f)) : []),
    ...extraSections(),
    sec(t('secHw'), [
      { hw: t('bolts'), sub: t('boltsNote', bolts), qty: bolts * count, raw: true },
      (state.handle || /Heawyweight/i.test(state.roof)) && { hw: t('m6'), sub: t('m6Note'), qty: null },
    ].filter(Boolean)),
  ].filter(Boolean);
}

/* ---------- Add-ons: grid dividers, supports, L² / XL² versions and Modifications ---------- */
// Every file that is not part of the plain unit is tagged with an add-on group; each "Add-ons" chip shows its group as a section.
// Groups with no file for this size are not offered.
const GRID_HOLES = { S: 10, M: 18, L: 26, XL: 32 };   // holes across the drawer, by width; by depth: 10 / 14 / 18 / 22 / 26
const ADDON_LABEL = { facade2: 'addFacade2', base2: 'addBase2', sup: 'addSup', l2: 'addL2', wall: 'addWall', pegU: 'addPegU', pegI: 'addPegI', feet: 'addFeet', wheels: 'addWheels', pull: 'addPull', stat: 'addStat', back: 'addBack', base: 'addBase' };
function addonItems() {
  const { w, d, h, type } = state;
  const items = [];   // { grp, f, qty, gdLen?, gdKind?, pick? }
  if (type === 'drawer') {
    const reach = Math.max(GRID_HOLES[w], 10 + 4 * (d - 3));
    const lenOf = f => Number((f.name.match(/^(\d+)/) || [])[1]);
    const fullFolder = h === '1F' ? '/34.5MM TALL' : '/82.5MM TALL';
    for (const f of FILES) {
      if (!f.p.startsWith('01. DRAWERS/07. Universal/Grid Dividers/') || !/\.stl$/i.test(f.p) || lenOf(f) > reach) continue;
      // 20 mm fits every height; 34.5 mm is full height in 1F and fits lower in 2F/4F; 82.5 mm is full height in 2F/4F.
      const kind = f.p.includes('/20MM TALL') ? 'low' : f.p.includes(fullFolder) ? 'full' : (h !== '1F' && f.p.includes('/34.5MM TALL') ? 'mid' : null);
      if (kind) items.push({ grp: null, gdLen: lenOf(f), gdKind: kind, f, qty: null });
    }
    // Other versions of the same baseplate (the plate picker above chooses one version of each kind).
    const picked = new Set(drawerBaseplates().flatMap(b => b.files.map(f => f.p)));
    for (const f of find(`${D_FAM(w)}${w}${d}/Gridfinity Baseplate/.*\\.stl$`)) if (!picked.has(f.p)) items.push({ grp: 'base2', f, qty: 1 });
    if (w === 'L' || w === 'XL') {
      for (const f of find(`${w === 'L' ? '04' : '06'}\\. ${w}² Families/${w}${d}²/${w}${d}² Module ${h}\\.stl$`)) items.push({ grp: 'l2', f, qty: 1 });
      if (w === 'L') for (const f of find(`${D_UNI}L² Accessories/x${d} Accessory`)) items.push({ grp: 'l2', f, qty: 1 });
    }
  }
  // Manual supports go by depth only; the sustainer manual uses them too ("remove manual supports, before filling it with dividers").
  const ms = first(`${D_UNI}Manual Supports/x${d}\\.stl$`);
  if (ms) items.push({ grp: 'sup', f: ms, qty: 1 });
  if (type === 'sustainer') for (const f of find(`${S_UNI}Facades/${w}${h}\\.stl$`)) items.push({ grp: 'facade2', f, qty: 1 });   // alternative facade, same size; replaces the standard one
  for (const f of FILES) {
    if (!f.p.startsWith('03. MODIFICATIONS/') || !/\.stl$/i.test(f.p)) continue;
    const n = f.name.replace(/\.stl$/i, '');
    let fit;
    let m = f.p.match(/\/Base\/(XL|[SML])\/(?:XL|[SML])(\d) Base/);
    if (m) fit = m[1] === w && Number(m[2]) === d;
    else if ((m = n.match(/^(XL|S|M|L)(1F|2F|4F)?(?= |$)/))) fit = m[1] === w && (!m[2] || m[2] === h);
    else if ((m = n.match(/^Universal (\dF)?/))) fit = !m[1] || m[1] === h;
    else { m = n.match(/(\dF)$/); fit = !m || m[1] === h; }   // "Connector for Modules 1F" only for 1F; wheels, knobs, connectors for every size
    if (!fit) continue;
    // The pull-out handle lock and its knob sit in the Backbone folder but belong to the pull-out handle (Modifications manual, steps 16-17).
    const grp = /\/Wall Mounts\//.test(f.p) ? 'wall' : /USSA Pegboard/.test(f.p) ? 'pegU' : /IKEA/.test(f.p) ? 'pegI' : /\/Feet\//.test(f.p) ? 'feet'
      : /\/Wheels\//.test(f.p) ? 'wheels' : /\/Pull-out Handle\//.test(f.p) || /Handle Lock/.test(n) ? 'pull' : /\/Stationary Handle\//.test(f.p) ? 'stat'
      : /\/Backbone\//.test(f.p) ? 'back' : /\/Base\//.test(f.p) ? 'base' : null;
    // Either/or versions: a base is printed whole or in two parts; backbone and handle lock parts are width-sized or universal (manual p.1).
    const pick = grp === 'base' ? (/ Part \d/.test(n) ? 'split' : / Whole$/.test(n) ? 'whole' : '')
      : (grp === 'back' || grp === 'pull') && /Backbone|Handle Lock(?! Knob)/.test(n) ? (/^Universal /.test(n) ? 'universal' : 'sized') : '';
    items.push({ grp, f, qty: 1, pick });
  }
  // A part with only one version for this size (e.g. XL 2F has only the universal backbone) is always the one used.
  const family = i => i.grp + (/Backbone/.test(i.f.name) ? ':bone' : /Handle Lock/.test(i.f.name) ? ':lock' : '');
  const versions = new Map();
  for (const i of items) if (i.pick) versions.set(family(i), (versions.get(family(i)) || new Set()).add(i.pick));
  for (const i of items) if (i.pick && versions.get(family(i)).size < 2) i.pick = '';
  return items;
}
const addonGroups = () => [...new Set(addonItems().map(i => i.grp).filter(Boolean))];
const PICK_KEY = { whole: 'baseCut', split: 'baseCut', sized: 'kit', universal: 'kit' };
const picked = i => !i.pick || state[PICK_KEY[i.pick]] === i.pick;
// The whole / split and sized / universal pickers are offered only when this size has both versions.
const pickChoices = key => [...new Set(addonItems().filter(i => i.pick && PICK_KEY[i.pick] === key).map(i => i.pick))];
// Grid dividers, then one section per add-on chip that is on, in the order the chips are shown.
function extraSections() {
  const { w, d } = state;
  const reach = Math.max(GRID_HOLES[w], 10 + 4 * (d - 3));
  const items = addonItems();
  const grid = items.filter(i => state.grid && i.gdLen && state.gdLens?.[i.gdLen] && i.gdKind === (state.gdh || 'full')).map(i => part(i.f, i.qty));
  return [
    sec(t('gridDiv'), grid, { sub: t('secGridNote', reach), raw: true }),
    ...addonGroups().filter(g => state.mods?.[g]).map(g => sec(t(ADDON_LABEL[g]), items.filter(i => i.grp === g && picked(i)).map(i => part(i.f, i.qty)), { raw: true })),
  ].filter(Boolean);
}

function sustainerDividers() {
  const { w, d, h } = state, dv = `${S_UNI}Dividers/`;
  if (w === 'S' || w === 'M') return find(`${dv}${w} Dividers/${w}${h} Divider\\.stl$`);
  if (w === 'L') return find(`${dv}L (Depth Dividers/L${d}-${h} Depth|Width Dividers/L-${h} Width|Seal Dividers/L-${h} Seal) Divider\\.stl$`);
  return find(`${dv}(XL Depth Dividers/XL${d} Depth Divider|XL Width Divider|XL Seal Divider \\(\\w+\\))\\.stl$`);
}
const sustainerBaseplates = () => find(`${S_UNI}Baseplates/[^/]+/${state.w}${state.d}( Part \\d)? +(Gridfinity )?Baseplate\\.stl$`);

function sustainerSections() {
  const { w, d, h } = state;
  const sm = w === 'S' || w === 'M';
  const variants = sustainerVariants();
  const mod = variants.find(v => v.id === state.variant) || variants[0];
  const lids = sustainerLids();
  const lid = lids.find(l => l.id === state.lid) || lids[0];
  const unit = [
    mod ? part(mod.file, 1) : part(null, 1, { expect: `${w}${d} ${h} Module` }),
    ...(state.mods?.facade2 && addonGroups().includes('facade2') ? [] : [part(first(`${S_FAM(w)}(Facades/)?${w}${h}'? Facade\\.stl$`), 1, { expect: `${w}${h} Facade` })]),   // the alternative facade replaces it
  ];
  const hingeSize = sm ? 'S-M' : (h === '1F' ? 'L-XL' : 'L');
  const hinge = [
    part(first(`${S_UNI}Hinges/${hingeSize} ${h === '1F' ? '1F' : '2-4F'} Hinge\\.stl$`), 1, { pcs: 2, expect: `${hingeSize} Hinge` }),
    part(first(`${S_UNI}Hinges/${sm ? w : 'L-XL'} Hinge Top\\.stl$`), 1, { pcs: sm ? 0 : 2, expect: 'Hinge Top' }),
    part(first(`${S_UNI}Rods/${sm ? 'S-M' : 'L-XL'} Rods\\.stl$`), 1, { pcs: 2, expect: 'Rods' }),
    part(first(`${S_UNI}Label for Sustainers`), 1, { expect: 'Label for Sustainers' }),
  ];
  const n = state.locks;
  const lock = n > 0 ? [
    part(first(`${S_UNI}Locks/LOCK HOLDER`), n),
    part(first(`${S_UNI}Locks/LOCK INNER PART`), n),
    part(first(`${S_UNI}Locks/LOCK OUTER PART ${h === '1F' ? '1F' : '2-4F'}`), n),
    part(first(`${S_UNI}Locks/1 SET OF PINS`), n, { pcs: 4 }),
  ] : [];
  return [
    sec(t('secUnit'), unit, { sub: `${w}${d} · ${h}${mod?.id ? ' · ' + mod.label : ''}` }),
    sec(t('lid'), lid ? lid.files.map(f => part(f)) : [part(null, 1, { expect: `${w}${d} Roof` })]),
    sec(t('secHinge'), hinge),
    sec(t('locks'), lock, { sub: t('secLockNote', n), raw: true }),
    sec(t('dividers'), state.dividers ? sustainerDividers().map(f => part(f, null)) : []),
    sec(t('baseplate'), state.sbase ? sustainerBaseplates().map(f => part(f)) : []),
    ...extraSections(),
    sec(t('secHw'), [{ hw: t('bolts'), sub: t('boltsSus'), qty: null }]),
  ].filter(Boolean);
}

/* ---------- Rendering helpers ---------- */
const thumbSrc = f => isImage(f) ? fileUrl(f.p) : f.th ? `_hub/thumbs/${f.th}.webp` : '';
const thumb = (f, icon = ICON.cube) => {
  const src = f && thumbSrc(f);
  const inner = src ? `<img src="${esc(src)}" alt="" loading="lazy">` : icon;
  return f ? `<button class="thumb" data-act="open" tabindex="-1" aria-hidden="true">${inner}</button>` : `<span class="thumb">${inner}</span>`;
};
const prettyName = n => n.replace(/\.stl$/i, '').replace(/\s*\(turn on supports\)/i, '').replace(/\s+/g, ' ').trim();

// Suggested filament finish: 'matte', 'basic' or 'tpu'; '' = no recommendation.
const MATERIAL_PATHS = [
  [/^03\. MODIFICATIONS\/Wheels\/Cover/, 'matte'],
  [/^03\. MODIFICATIONS\/(Wheels|Backbone|Feet|Pegboard Attachment|Wall Mounts|Base)\//, 'basic'],
  [/\/Grid Dividers\//, 'matte'],
  [/\/L\u00b2 Accessories\//, 'basic'],
  [/\/Manual Supports\//, 'basic'],
  [/^02\. SUSTAINERS\/05\. Universal\/(Hinges|Rods|Locks)\//, 'basic'],
];
function material(f) {
  if (!isModel(f)) return '';
  if (/Tyre|TPU/i.test(f.name)) return 'tpu';
  for (const [re, m] of MATERIAL_PATHS) if (re.test(f.p)) return m;
  if (/Handle|Runner|Key|Latch|Spring|Rail|Label|Facade Cap/i.test(f.name)) return 'basic';
  if (/Module|Box|Back Panel|Roof|Baseplate|Divider|Facade/i.test(f.name) || /\/Facades?\//.test(f.p)) return 'matte';
  return '';
}
// Which part of the Colors tab a file belongs to, so its Matte / Basic tag can show the color picked there.
// Matte parts without a role of their own follow the body color; basic parts without a role (runners, springs, hinges...) show no color.
function colorRole(f) {
  const m = material(f), n = f.name;
  if (m === 'matte') return /Facade/i.test(n) || /\/Facades?\//.test(f.p) ? 'facade' : /Roof/i.test(n) ? 'roof' : 'body';
  if (m !== 'basic') return '';
  if (/Hinge/i.test(n) || /\/Hinges\//.test(f.p)) return 'hinge';
  if (/Rods/i.test(n) || /\/Rods\//.test(f.p)) return 'rod';
  if (/Key Cap/i.test(n)) return 'keycap';
  if (/Key/i.test(n)) return 'key';
  if (/Handle/i.test(n)) return 'handle';
  if (/Label/i.test(n)) return 'label';
  if (/Runner Stopper/i.test(n)) return 'stopper';
  if (/LOCK /i.test(n) || /\/Locks\//.test(f.p)) return 'lock';
  return '';
}
const matBadge = (m, cls = '', f = null) => {
  if (!m) return '';
  const role = f ? colorRole(f) : '', c = role ? colorOf(role) : null;
  // The whole tag takes the picked color (with light or dark text for contrast); parts without a color role keep the plain tag.
  const paint = c ? ` style="background:${c.hex};color:${isDarkHex(c.hex) ? '#fff' : '#18191b'};border-color:rgba(128,128,128,.5)"` : '';
  return `<span class="badge mat ${m}${cls}"${paint} title="${esc(t(m + 'Tip') + (c ? ' · ' + colorName(c) : ''))}">${esc(t(m))}</span>`;
};

// The hero's filament list: one chip per spool to load (finish + the color picked on the Colors tab), with how many parts use it.
// Parts that have no color role on the Colors tab (runners, springs...) are grouped per finish as "any color".
function filamentChips(files) {
  const groups = new Map();
  for (const f of files) {
    const m = material(f); if (!m) continue;
    const role = colorRole(f), c = role ? colorOf(role) : null, key = m + '|' + (c ? c.id : '');
    const g = groups.get(key) || { m, c, n: 0, roles: new Set() };
    g.n++; if (role) g.roles.add(t('role_' + role)); groups.set(key, g);
  }
  const order = ['matte', 'basic', 'tpu'];
  return [...groups.values()].sort((a, b) => order.indexOf(a.m) - order.indexOf(b.m) || (!!b.c - !!a.c) || b.n - a.n).map(g => {
    const tip = g.c ? `${t(g.m + 'Tip')} · ${[...g.roles].join(', ')}` : `${t(g.m + 'Tip')} · ${t('anyColor')}`;
    const dot = g.c ? `<i class="dot" style="background:${g.c.hex}"></i>` : '';
    return `<span class="fil ${g.m}${g.c ? '' : ' any'}" title="${esc(tip)}">${dot}<span>${g.c ? esc(colorName(g.c)) + ' · ' : ''}${esc(t(g.m))}</span><b>× ${g.n}</b></span>`;
  }).join('');
}

function badges(f, item = {}) {
  const b = [];
  if (/turn on supports/i.test(f.name)) b.push(`<span class="badge sup">${t('supports')}</span>`);
  if (item.pcs) b.push(`<span class="badge pcs">${t('pcs', item.pcs)}</span>`);
  if (!isModel(f)) b.push(`<span class="badge muted">${ext(f).toUpperCase()}</span>`);
  if (item.mat) b.push(matBadge(material(f), '', f));   // the material tag comes last
  return b.join('');
}

function fileRow(f, item = null) {
  const done = printed.has(f.p);
  let qty = '';
  if (item) {
    if (item.qty == null) qty = `<span class="qty na">${t('asNeeded')}</span>`;
    else qty = `<span class="qty">×${item.once || item.raw ? item.qty : item.qty * state.count}</span>`;
  }
  const canCheck = isModel(f);
  const on = !item || isOn(item);
  return `<li class="row${done && on ? ' done' : ''}${on ? '' : ' off'}" data-path="${esc(f.p)}">
    ${canCheck ? `<label class="ck"><input type="checkbox" data-act="check"${done ? ' checked' : ''}${on ? '' : ' disabled'} aria-label="${esc(t('markPrinted'))}"><span></span></label>` : '<span></span>'}
    ${thumb(f, isModel(f) ? ICON.cube : ICON.eye)}
    <button class="meta" data-act="open" title="${esc(f.p)}"><span class="nm">${esc(prettyName(f.name))}</span><span class="pt">${esc(f.dir)}</span>${matBadge(material(f), ' mat-sm', f)}</button>
    <span class="badges">${badges(f, { ...item, mat: true })}</span>
    ${item ? qty : ''}
    <span class="sz">${fmtSize(f.s)}</span>
    <span class="acts-row">
      ${item && isModel(f) ? `<label class="switch inc" title="${esc(t('incTip'))}"><input type="checkbox" data-act="inc"${on ? ' checked' : ''} aria-label="${esc(t('incTip'))}"><span></span></label>` : ''}
      <button class="ib" data-act="open" title="${esc(t('preview'))}">${isModel(f) ? ICON.cube : ICON.eye}</button>
      <button class="ib" data-act="reveal" title="${esc(t('reveal'))}" aria-label="${esc(t('reveal'))}">${ICON.folder}</button>
    </span>
  </li>`;
}

function itemRow(item) {
  if (item.f) return fileRow(item.f, item);
  if (item.hw) return `<li class="row hw"><span></span>${thumb(null, ICON.bolt)}
    <div class="meta"><span class="nm">${esc(item.hw)}</span><span class="pt">${esc(item.sub)}</span></div>
    <span class="badges"></span>${item.qty == null ? `<span class="qty na">${esc(t('seeManual'))}</span>` : `<span class="qty">×${item.qty}</span>`}<span class="sz"></span><span class="acts-row"></span></li>`;
  return `<li class="row missing"><span></span>${thumb(null, ICON.cube)}
    <div class="meta"><span class="nm">${esc(item.missing)}</span><span class="pt">${esc(t(item.spec ? 'notInPack' : 'missing'))}</span></div>
    <span class="badges"></span><span class="qty">×${item.qty ?? '–'}</span><span class="sz"></span><span class="acts-row"></span></li>`;
}

/* ---------- Builder UI ---------- */
const seg = (key, options) => `<div class="seg" role="group">${options.map(o =>
  `<button type="button" data-set="${key}" data-val="${esc(o.val)}" aria-pressed="${String(state[key]) === String(o.val)}"${o.disabled ? ' disabled' : ''}>${esc(o.label)}${o.small ? `<small>${esc(o.small)}</small>` : ''}</button>`).join('')}</div>`;
const opts = (key, options) => `<div class="opts">${options.map(o =>
  `<button type="button" class="opt" data-set="${key}" data-val="${esc(o.val)}" aria-pressed="${String(state[key]) === String(o.val)}"${o.file ? ` title="${esc(o.file.name)}"` : ''}>
    <span class="pic">${o.file && thumbSrc(o.file) ? `<img src="${esc(thumbSrc(o.file))}" alt="" loading="lazy">` : '<span class="none"></span>'}</span>${esc(o.label)}</button>`).join('')}</div>`;
const chips = (key, options) => `<div class="chips">${options.map(o =>
  `<button type="button" class="chip" data-set="${key}" data-val="${esc(o.val)}" aria-pressed="${String(state[key]) === String(o.val)}">${esc(o.label)}</button>`).join('')}</div>`;
const field = (label, body, small = '') => `<div class="field"><div class="lbl">${esc(label)}${small ? `<small>${esc(small)}</small>` : ''}</div>${body}</div>`;
const stepperCtl = (key, min, max) => `<div class="stepper"><button type="button" data-step="${key}" data-val="-1" aria-label="−"${state[key] <= min ? ' disabled' : ''}>−</button><output>${state[key]}</output><button type="button" data-step="${key}" data-val="1" aria-label="+"${state[key] >= max ? ' disabled' : ''}>+</button></div>`;
const stepper = (key, label, min, max) => `<div class="row-inline field"><div class="lbl">${esc(label)}</div>${stepperCtl(key, min, max)}</div>`;
const toggle = (key, label) => `<label class="row-inline field"><div class="lbl">${esc(label)}</div>
  <span class="switch"><input type="checkbox" data-toggle="${key}"${state[key] ? ' checked' : ''}><span></span></span></label>`;

function renderConfig() {
  const { w, d } = state;
  const drawer = state.type === 'drawer';
  let html = '';
  if (drawer) {
    html += field(t('lock'), seg('lock', [{ val: 'key', label: t('lockKey') }, { val: 'hidden', label: t('lockHidden') }]));
    html += field(t('roof'), opts('roof', [{ val: '', label: t('none') }, ...drawerRoofs().map(r => ({ val: r.id, label: r.label, file: r.files[0] }))]));
    html += toggle('handle', t('handle'));
    const bases = drawerBaseplates();
    if (bases.length) html += field(t('baseplate'), opts('base', [{ val: '', label: t('none') }, ...bases.map(b => ({ val: b.id, label: b.label, file: b.files[0] }))]));
  } else {
    const variants = sustainerVariants();
    if (variants.length > 1) html += field(t('modStyle'), opts('variant', variants.map(v => ({ val: v.id, label: v.label, file: v.file }))));
    const lids = sustainerLids();
    if (lids.length > 1) html += field(t('lid'), opts('lid', lids.map(l => ({ val: l.id, label: l.label, file: l.files.find(f => !/Connector/i.test(f.name)) }))));
    html += stepper('locks', t('locks'), 0, 4);
    const dividers = sustainerDividers(), sbases = sustainerBaseplates();
    if (dividers.length) html += field(t('dividers'), opts('dividers', [{ val: false, label: t('none') }, { val: true, label: t('include'), file: dividers[0] }]));
    if (sbases.length) html += field(t('baseplate'), opts('sbase', [{ val: false, label: t('none') }, { val: true, label: sbases.length > 1 ? t('twoParts') : t('include'), file: sbases[0] }]));
  }
  if (drawer) html += toggle('grid', t('gridDiv'));
  if (drawer && state.grid) {
    const wide = GRID_HOLES[w], deep = 10 + 4 * (d - 3);

// Published print time and filament, summed into one figure (grams first, then time). Published for the x3 length only.
// A drawer prints its roof once per stack; everything else is per unit, so it scales with the quantity.
const toMin = hm => { const [h, m] = hm.split(':').map(Number); return h * 60 + m; };
const fmtHM = min => `${Math.floor(min / 60)}:${String(min % 60).padStart(2, '0')}`;
function printFacts() {
  const { type, w, d, h, count } = state;
  const pr = SPEC.print[type][w];
  if (!pr?.[h]) return '';
  const mod = pr[h], roof = pr.roof, nm = count;
  const grams = mod[1] * nm + (roof ? roof[1] * (type === 'drawer' ? 1 : count) : 0);
  const mins = toMin(mod[0]) * nm + (roof ? toMin(roof[0]) * (type === 'drawer' ? 1 : count) : 0);
  const note = `${t('specPrint', h)}${nm > 1 ? ` × ${nm}` : ''}${roof ? ` + ${t('specRoof')}${type === 'drawer' ? '' : nm > 1 ? ` × ${nm}` : ''}` : ''} · ${d === 3 ? t('specPerUnit') : t('specX3')}`;
  const icon = { g: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 20h12l-1.6-10H7.6L6 20Z"/><circle cx="12" cy="6" r="2.5"/></svg>', t: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 1.5M9.5 2.5h5"/></svg>' };
  return `<span class="print" title="${esc(note)}"><span>${icon.g}${grams} g</span><span>${icon.t}${fmtHM(mins)} h${d === 3 ? '' : ' <em>x3</em>'}</span></span>`;
}

function specGrid() {
  const { type, w, d, h } = state;
  const ins = SPEC.inside[type];
  const outer = `${mm(SPEC.width[w])} × ${SPEC.length(d)} × ${SPEC.height[type][h]}`;
  const inside = ins.width[w] ? `${ins.width[w]} × ${ins.length(d)} × ${ins.height[h]}` : '—';
  const cell = (label, value, sub = '') => `<div class="spec"><span>${esc(label)}</span><b>${value}</b>${sub ? `<small>${esc(sub)}</small>` : ''}</div>`;
  const cells = [
    cell(t('specOuter'), `${outer}<i>mm</i>`, t('specWLH')),
    cell(t('specInside'), inside === '—' ? '—' : `${inside}<i>mm</i>`, t('specWLH')),
    cell(t('specGrid'), `${SPEC.gridWidth[w]} × ${d}`, t('specGridSub')),
  ].filter(Boolean);
  return `<div class="specs" data-n="${cells.length}" style="--n:${cells.length}">${cells.join('')}</div>`;
}

// The launcher's server can reveal files in Finder/Explorer; a plain page can only copy the path.
let HUB = false;
async function hubCall(route, body) {
  const res = await fetch(route, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Vault-Hub': '1' }, body: JSON.stringify(body) });
  const json = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(json.error || res.statusText);
  return json;
}
function absolutePath(p) {
  if (!LOCAL) return p;
  const dir = decodeURIComponent(location.pathname).replace(/[^/]*$/, '');
  const full = dir + p;
  return /^\/[A-Za-z]:/.test(full) ? full.slice(1).replace(/\//g, '\\') : full;
}
async function reveal(p) {
  if (HUB) { try { await hubCall('/api/reveal', { path: p }); } catch (err) { toast(err.message); } return; }
  await copyText(absolutePath(p));

}

}

/* ---------- Preview ---------- */
const pv = { list: [], index: 0, token: 0, viewer: null, wire: false };

async function loadViewer() {
  if (pv.viewer) return pv.viewer;
  const THREE = await import('three');
  const { STLLoader } = await import('three/addons/loaders/STLLoader.js');
  const { OrbitControls } = await import('three/addons/controls/OrbitControls.js');
  const stage = $('#pv-stage');
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  stage.prepend(renderer.domElement);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 10000);
  scene.add(camera, new THREE.HemisphereLight(0xffffff, 0x50545c, 1.5));
  const key = new THREE.DirectionalLight(0xffffff, 2.4);
  key.position.set(0.6, 1, 0.8);
  camera.add(key);
  const rim = new THREE.DirectionalLight(0xffffff, 0.8);
  rim.position.set(-1, 0.4, -1);
  scene.add(rim);
  const css = getComputedStyle(document.documentElement);
  const material = new THREE.MeshStandardMaterial({ color: new THREE.Color(css.getPropertyValue('--model').trim()), roughness: 0.55, metalness: 0.05 });
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  let mesh = null, grid = null, home = null;
  const resize = () => {
    const { clientWidth: w, clientHeight: h } = stage;
    if (!w || !h) return;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  };
  new ResizeObserver(resize).observe(stage);
  renderer.setAnimationLoop(() => { if (pv.open) { controls.update(); renderer.render(scene, camera); } });
  const viewer = {
    show(buffer) {
      if (mesh) { scene.remove(mesh); mesh.geometry.dispose(); }
      if (grid) { scene.remove(grid); grid.geometry.dispose(); }
      const g = new STLLoader().parse(buffer);
      g.rotateX(-Math.PI / 2);
      g.computeVertexNormals();
      g.computeBoundingBox();
      const c = g.boundingBox.getCenter(new THREE.Vector3());
      g.translate(-c.x, -g.boundingBox.min.y, -c.z);
      g.computeBoundingBox();
      const size = g.boundingBox.getSize(new THREE.Vector3());
      mesh = new THREE.Mesh(g, material);
      scene.add(mesh);
      const span = Math.ceil(Math.max(size.x, size.z) * 1.6 / 10) * 10;
      grid = new THREE.GridHelper(span, span / 10, css.getPropertyValue('--grid').trim(), css.getPropertyValue('--grid').trim());
      grid.material.transparent = true;
      grid.material.opacity = 0.22;
      scene.add(grid);
      const radius = size.length() / 2;
      const dist = radius / Math.sin(THREE.MathUtils.degToRad(camera.fov / 2)) * 1.05;
      controls.target.set(0, size.y / 2, 0);
      camera.position.set(dist * 0.62, size.y / 2 + dist * 0.48, dist * 0.62);
      camera.near = dist / 100;
      camera.far = dist * 20;
      camera.updateProjectionMatrix();
      home = camera.position.clone();
      controls.update();
      resize();
      return { x: size.x, y: size.z, z: size.y, tris: g.attributes.position.count / 3 };
    },
    reset() { if (home) { camera.position.copy(home); controls.update(); } },
    wire(on) { material.wireframe = on; },
  };
  pv.viewer = viewer;
  return viewer;
}

function message(html) { const m = $('#pv-msg'); m.innerHTML = html ? `<div class="box">${html}</div>` : ''; m.hidden = !html; }

function step(n) {
  if (!pv.open || pv.list.length < 2) return;
  pv.index = (pv.index + n + pv.list.length) % pv.list.length;
  showCurrent();
}
async function showCurrent() {
  const f = pv.list[pv.index];
  const token = ++pv.token;
  $('#pv-name').textContent = prettyName(f.name);
  $('#pv-path').textContent = f.p;
  pv.path = f.p;
  $('#pv-reveal').innerHTML = `${ICON.folder}<span>${esc(t('reveal'))}</span>`;
  $('#pv-app').hidden = !HUB || !isModel(f);
  $('#pv-prev').hidden = $('#pv-next').hidden = pv.list.length < 2;
  $('#pv-hint').hidden = true;
  setStats(null);
  const canvas = $('#pv-stage canvas');
  const img = $('#pv-img');
  if (isImage(f)) {
    if (canvas) canvas.style.visibility = 'hidden';
    img.hidden = false;
    img.src = fileUrl(f.p);
    message('');
    $('#pv-reset').hidden = $('#pv-wire').hidden = true;
    return;
  }
  img.hidden = true;
  img.removeAttribute('src');
  $('#pv-reset').hidden = $('#pv-wire').hidden = true;
  message(`<div class="spinner"></div><p>${esc(t('loading'))}</p>`);
  let viewer;
  try { viewer = await loadViewer(); }
  catch { if (token === pv.token) message(`<h3>${esc(t('offlineTitle'))}</h3><p>${esc(t('offlineBody'))}</p>`); return; }
  if (token !== pv.token) return;
  const c = $('#pv-stage canvas');
  c.style.visibility = 'hidden';
  let buffer;
  try {
    const res = await fetch(fileUrl(f.p));
    if (!res.ok) throw new Error(res.status);
    buffer = await res.arrayBuffer();
  } catch {
    if (token !== pv.token) return;
    message(`<h3>${esc(t('blockedTitle'))}</h3><p>${t('blockedBody')}</p><button class="btn" data-pick>${esc(t('pick'))}</button>`);
    return;
  }
  if (token !== pv.token) return;
  c.style.visibility = 'visible';
  showStl(buffer);
}

async function showLocalFile(file) {
  if (!file || !/\.stl$/i.test(file.name)) return;
  const token = ++pv.token;
  message(`<div class="spinner"></div><p>${esc(t('loading'))}</p>`);
  try { await loadViewer(); } catch { message(`<h3>${esc(t('offlineTitle'))}</h3><p>${esc(t('offlineBody'))}</p>`); return; }
  const buffer = await file.arrayBuffer();
  if (token !== pv.token) return;
  $('#pv-img').hidden = true;
  $('#pv-stage canvas').style.visibility = 'visible';
  $('#pv-name').textContent = prettyName(file.name);
  showStl(buffer);
}

// Display colors for choosing filament.
const PALETTE = {
  matte: [
    { id: 'white', hex: '#FFFFFF' }, { id: 'black', hex: '#000000' }, { id: 'lime', hex: '#C0DF16' },
    { id: 'grey', hex: '#7F7E83' }, { id: 'pink', hex: '#FABBCB' }, { id: 'lightblue', hex: '#B9D9EB' },
    { id: 'violet', hex: '#A7A4E0' }, { id: 'avocado', hex: '#BCE194' },
  ],
  basic: [
    { id: 'orange', hex: '#FF671D' }, { id: 'red', hex: '#D6001C' }, { id: 'yellow', hex: '#FCE400' }, { id: 'green', hex: '#00963A' },
    { id: 'blue', hex: '#0285D7' }, { id: 'darkblue', hex: '#001489' }, { id: 'white', hex: '#FFFFFF' }, { id: 'beige', hex: '#DBC8B7' },
    { id: 'black', hex: '#000000' }, { id: 'brown', hex: '#502C1E' }, { id: 'grey', hex: '#7F7E83' }, { id: 'bluegrey', hex: '#688197' },
    { id: 'darkgreen', hex: '#044537' },
  ],
};
// What gets a color: the finish of each role follows the Matte / Basic tags above.
const ROLE_FINISH = { body: 'matte', facade: 'matte', roof: 'matte', handle: 'basic', key: 'basic', keycap: 'basic', lock: 'basic', hinge: 'basic', rod: 'basic', label: 'basic', stopper: 'basic' };
const ROLE_DEFAULT = { body: 'white', facade: 'white', roof: 'white', handle: 'black', key: 'black', keycap: 'white', lock: 'black', hinge: 'black', rod: 'orange', label: 'white', stopper: 'orange' };
const ROLES = Object.keys(ROLE_FINISH);
const isDarkHex = hex => { const n = parseInt(hex.slice(1), 16); return (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) < 120; };
const colorUI = (() => {
  const saved = store.get('colors', {});
  return { role: ROLE_FINISH[saved.role] ? saved.role : 'body', choice: saved.choice && !saved.choice.drawer ? saved.choice : {} };
})();
const saveColors = () => store.set('colors', colorUI);
const colorOf = role => PALETTE[ROLE_FINISH[role]].find(c => c.id === colorUI.choice[role]) ?? PALETTE[ROLE_FINISH[role]].find(c => c.id === ROLE_DEFAULT[role]);
const colorName = c => t('c_' + c.id);
const col = { enginePromise: null, engine: null, tower: null, home: null };

// Templates: named sets of color picks kept in this browser, loaded with one click.
const templates = () => store.get('colorTemplates', []);
const saveTemplates = list => store.set('colorTemplates', list);
// A template without a typed name is shown as its colors: one small circle per distinct color, in the order of the part list.
const swatchDots = pick => [...new Map(ROLES.map(r => { const c = PALETTE[ROLE_FINISH[r]].find(x => x.id === (pick?.[r] ?? ROLE_DEFAULT[r])); return [c.hex, c]; })).values()]
  .map(c => `<i class="sw" style="background:${c.hex}" title="${esc(colorName(c))}"></i>`).join('');
const templateLabel = (tpl, name) => `<span class="dots">${swatchDots(tpl.choice)}</span>${name ? `<span>${esc(name)}</span>` : ''}`;   // no names: a template is just its colors
const snapshot = () => ({ choice: Object.fromEntries(ROLES.map(r => [r, colorOf(r).id])) });
const colorNames = pick => [...new Set(ROLES.map(r => colorName(PALETTE[ROLE_FINISH[r]].find(x => x.id === (pick?.[r] ?? ROLE_DEFAULT[r])))))].join(' · ');
const matchesTemplate = tpl => ROLES.every(r => (tpl.choice?.[r] ?? ROLE_DEFAULT[r]) === colorOf(r).id);
const loadTemplate = tpl => { colorUI.choice = { ...(tpl.choice ?? {}) }; };

// Accepts a colors.json from Download (role -> {color, hex}) or a template ({choice}); unknown roles and colors are skipped.
function importColors(text) {
  let data;
  try { data = JSON.parse(text); } catch { return 0; }
  const src = data?.choice ?? data;
  let n = 0;
  for (const r of ROLES) {
    const v = src?.[r];
    if (!v) continue;
    const id = typeof v === 'string' ? v : v.color, hex = typeof v === 'object' ? String(v.hex ?? '').toLowerCase() : '';
    const pal = PALETTE[ROLE_FINISH[r]];
    const c = pal.find(x => x.id === id) ?? (hex && pal.find(x => x.hex.toLowerCase() === hex));
    if (c) { colorUI.choice[r] = c.id; n++; }
  }
  return n;
}
$('#col-file').addEventListener('change', async e => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  const n = importColors(await file.text());
  if (n) { saveColors(); renderColors(); toast(t('colImportDone', n)); } else toast(t('colImportFail'));
});

function colorsExport() {

    }).join('')}</div>`) +

      `<button type="button" data-ccolor="${c.id}" aria-pressed="${c.id === colorOf(role).id}"><i class="sw" style="background:${c.hex}"></i>${esc(colorName(c))}<small>${c.hex}</small></button>`).join('')}</div>`, t(finish)) +
